syntax = "proto3";

package com.platform.notification.v1;

option java_multiple_files = true;
option java_package = "org.sophie.notificationservice.grpc";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";
import "common/pagination.proto";

// Generic notification service: "a thing happened that's worth notifying someone about",
// independent of source producer (Chat Service and Calendar Service today; Tasks/Docs are expected
// future producers) and independent of delivery channel (in-app + push today; email/SMS are expected
// future channels layered on top, not a redesign of this contract).
//
// type/source_reference/payload are opaque here by design — Notification Service never parses them,
// it only stores and returns them (see Notification.type below). The actual per-type contracts live
// in each producer's own .proto file, next to the RPCs that trigger them (see chat_service.proto's
// "Notification Service integration" section for Chat's two types, calendar_service.proto's for
// Calendar's six) — a producer is the only party that knows its own notification shapes, so its proto
// file is the right place to define them, not this one.
service NotificationService {
  // Internal only — trusted the same as Org Service's IsOrgMember/BatchGetUsers: no x-user-id is
  // required, any backend service may create a notification for any recipient. Publishes a
  // notification.created event to the recipient's Redis Pub/Sub channel on success.
  rpc CreateNotification(CreateNotificationRequest) returns (Notification);
  // Caller-scoped via x-user-id (identity propagation, same pattern as Chat Service) — only ever
  // returns the caller's own notifications. The optional type filter (e.g. "chat.mention") is what
  // makes this double as a mentions view.
  rpc ListMyNotifications(ListMyNotificationsRequest) returns (ListMyNotificationsResponse);
  // Caller must be the notification's own recipient. Idempotent: already-read is a silent no-op.
  rpc MarkNotificationRead(MarkNotificationReadRequest) returns (google.protobuf.Empty);
  // Marks every unread notification the caller owns in org_id as read.
  rpc MarkAllRead(MarkAllReadRequest) returns (google.protobuf.Empty);
  // Fast unread count for a badge, scoped to the caller + org_id.
  rpc GetUnreadCount(GetUnreadCountRequest) returns (GetUnreadCountResponse);

  // Caller-scoped via x-user-id: registers (upserts) an FCM push token the caller's browser/device
  // obtained. Re-registering the same token just refreshes last_used_at. A user may hold many tokens.
  rpc RegisterPushToken(RegisterPushTokenRequest) returns (google.protobuf.Empty);
  // Removes a push token (best-effort logout cleanup). Token-scoped, not caller-scoped: a token is a
  // device-held secret, and dropping one that's already gone is a harmless no-op.
  rpc UnregisterPushToken(UnregisterPushTokenRequest) returns (google.protobuf.Empty);
}

message Notification {
  string id = 1;
  string recipient_user_id = 2;
  string org_id = 3;
  string type = 4;             // Producer-defined, dotted-lowercase, namespaced by producer: "<producer>.<event>"
                                // (e.g. "chat.mention", "calendar.event_invite") — see the producing service's
                                // own .proto for what source_reference/payload actually contain for its types.
  string source_service = 5;   // e.g. "chat-service" — which service created this
  string source_reference = 6; // caller-supplied JSON, stored/returned opaquely (e.g. conversationId, messageId)
  string payload = 7;          // caller-supplied JSON, stored/returned opaquely (human-readable render data)
  google.protobuf.Timestamp created_at = 8;
  optional google.protobuf.Timestamp read_at = 9; // presence = read
}

message CreateNotificationRequest {
  string recipient_user_id = 1;
  string org_id = 2;
  string type = 3;
  string source_service = 4;
  string source_reference = 5; // JSON
  string payload = 6;          // JSON
}

message ListMyNotificationsRequest {
  string org_id = 1;
  // Keyset on (created_at, id) DESC (newest first). Default direction FORWARD = older than cursor.
  .org.sophie.common.PageRequest page = 2;
  bool unread_only = 4;
  optional string type = 5;
}

message ListMyNotificationsResponse {
  repeated Notification notifications = 1; // newest first
  .org.sophie.common.PageResponse page = 2;
}

message MarkNotificationReadRequest {
  string notification_id = 1;
}

message MarkAllReadRequest {
  string org_id = 1;
}

message GetUnreadCountRequest {
  string org_id = 1;
}

message GetUnreadCountResponse {
  int64 count = 1;
}

message RegisterPushTokenRequest {
  string token = 1;
  string platform = 2; // WEB now; ANDROID/IOS reserved
}

message UnregisterPushTokenRequest {
  string token = 1;
}

// ===================== Realtime event envelope =====================
// Not part of the RPC surface. JSON-serialized (via protobuf JsonFormat) and PUBLISHed to
// `user:{userId}:events` — the same channel Chat Service already publishes to — so websocket-service
// (already a dumb relay) needs no changes to carry this as its second real producer.

message NotificationEvent {
  string type = 1; // notification.created
  Notification notification = 2;
}
