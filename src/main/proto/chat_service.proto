syntax = "proto3";

package com.platform.chat.v1;

option java_multiple_files = true;
option java_package = "org.sophie.chatservice.grpc";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";
import "common/pagination.proto";

service ChatService {
  rpc Ping(PingRequest) returns (PingResponse);

  // ===================== Conversations + membership =====================
  // Messages, threads, reactions, mentions, read state, and attachments are a separate step —
  // their tables exist (messages FKs from several of them) but no RPCs touch them yet.

  // Any org member may call this. Creator becomes OWNER; each valid initial_member_user_ids entry
  // becomes MEMBER. Every member (creator included) must be validated as an org member first.
  rpc CreateGroupChannel(CreateGroupChannelRequest) returns (Conversation);
  // CHANNEL only (rejected for DIRECT). Caller must be OWNER or ADMIN of the conversation.
  rpc AddConversationMember(AddConversationMemberRequest) returns (google.protobuf.Empty);
  // CHANNEL only (rejected for DIRECT). Caller must be OWNER or ADMIN; the OWNER cannot be removed
  // this way — ownership must be transferred first.
  rpc RemoveConversationMember(RemoveConversationMemberRequest) returns (google.protobuf.Empty);
  // Only the current OWNER may call. Atomically demotes the current OWNER to ADMIN and promotes
  // new_owner_user_id (who must already be a member) to OWNER.
  rpc TransferOwnership(TransferOwnershipRequest) returns (google.protobuf.Empty);
  // The caller's conversations in this org, split by type. direct_conversations is empty until DM
  // conversations exist (lazily created by the Messages step) — expected, not a bug here.
  rpc ListMyConversations(ListMyConversationsRequest) returns (ListMyConversationsResponse);
  // Caller must be a member. Returns the conversation plus its member list with roles.
  rpc GetConversation(GetConversationRequest) returns (Conversation);
  // Admin-facing: every live CHANNEL (group_conversations only — DMs aren't "access" in the
  // org-service sense) that target user_id belongs to in this org, each with its real member list
  // (so the caller can read off that user's actual local role). Caller must be org_id's Org Admin —
  // this is the one RPC in this service that looks at someone OTHER than the caller's own
  // membership, for the "what does this person actually have access to" admin view.
  rpc ListConversationsForUser(ListConversationsForUserRequest) returns (ListConversationsForUserResponse);

  // ===================== Messages, threads, reactions, mentions, read state =====================

  // Targets an existing conversation (conversation_id) or lazily starts/continues a DM
  // (direct_message_target) — reuses the existing DIRECT conversation between caller and recipient
  // in that org if one exists, creates it (both members, no OWNER/ADMIN) otherwise, in the same
  // transaction as the message insert. Caller must be a member of the target conversation (or, for
  // the lazy-DM case, an org member). Thread depth is exactly one level: thread_root_message_id must
  // not itself be a thread reply. Every mentioned_user_ids entry must already be a conversation
  // member. Publishes a live event to every conversation member over Redis Pub/Sub.
  rpc SendMessage(SendMessageRequest) returns (Message);
  // Only the original sender may edit. Publishes a live event to conversation members.
  rpc EditMessage(EditMessageRequest) returns (Message);
  // Soft delete. Sender always may; for CHANNEL conversations OWNER/ADMIN may too; for DIRECT only
  // the sender. Publishes a live event to conversation members.
  rpc DeleteMessage(DeleteMessageRequest) returns (google.protobuf.Empty);
  // Main feed only (thread_root_message_id IS NULL); soft-deleted messages are included so reply
  // chains don't show gaps. Returned page is always ascending by created_at (oldest first, newest
  // last). Keyset on (created_at, id); page.direction BACKWARD (default) reads older than the cursor,
  // FORWARD reads newer. Caller must be a conversation member.
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse);
  // A single message by id, regardless of which page it'd fall on — used to jump to a message that
  // isn't in an already-loaded page (e.g. a search hit or a deep link): the client pages backward and
  // forward from the returned message's own `cursor` to load a window around it. Caller must be a
  // member of the message's conversation. reactions is always empty here (same known limitation as
  // EditMessage/DeleteMessage's returned Message — see MessageService#loadFullView).
  rpc GetMessage(GetMessageRequest) returns (Message);
  // Replies to a given thread root, oldest first. Caller must be a member of the root message's
  // conversation.
  rpc ListThreadReplies(ListThreadRepliesRequest) returns (ListThreadRepliesResponse);
  // Idempotent: the same user+emoji twice is a no-op (matches the reactions PK). Caller must be a
  // conversation member. Publishes a live event.
  rpc AddReaction(AddReactionRequest) returns (google.protobuf.Empty);
  rpc RemoveReaction(RemoveReactionRequest) returns (google.protobuf.Empty);
  // Upserts read_states. Caller must be a conversation member. Not published live — read state is
  // pulled on demand, not pushed.
  rpc MarkAsRead(MarkAsReadRequest) returns (google.protobuf.Empty);
  // Message-scoped download authorization: verifies requested_by is a member of the conversation the
  // message belongs to AND that file_id is actually attached to message_id, then returns a fresh
  // short-lived presigned GET URL (obtained from File Service internally). This is the trust boundary
  // the File Service delegates — File Service itself does no permission checks.
  rpc GetAttachmentDownloadUrl(GetAttachmentDownloadUrlRequest) returns (GetAttachmentDownloadUrlResponse);
  // Channel topic/description. Caller (from identity context) must be OWNER or ADMIN of the channel.
  rpc UpdateChannelDescription(UpdateChannelDescriptionRequest) returns (Conversation);
  rpc UpdateChannelName(UpdateChannelNameRequest) returns (Conversation); // OWNER/ADMIN

  // ===================== Per-user chat-list state (pin/mute/archive/unread) =====================
  // All: caller must be a member of conversation_id, else PERMISSION_DENIED. All publish
  // conversation.state_updated (the caller-scoped Conversation) to the CALLER's own user:{id}:events
  // channel only, so the caller's other devices stay in sync — never to other conversation members.

  // pinned=true: pinned_rank = max(existing pinned rank for this caller in this org) + 1. More than 10
  // already-pinned conversations for the caller in that org → FAILED_PRECONDITION. pinned=false: clears
  // the rank (NULL).
  rpc SetConversationPinned(SetConversationPinnedRequest) returns (Conversation);
  // conversation_ids must be exactly the caller's currently-pinned conversation ids in org_id (same set,
  // any order) or INVALID_ARGUMENT. Assigns pinned_rank 0..n-1 in the given order.
  rpc ReorderPinnedConversations(ReorderPinnedConversationsRequest) returns (google.protobuf.Empty);
  // forever=true -> muted_until = 'infinity'. Else muted_until must be a future timestamp. Neither set
  // -> unmute (muted_until cleared).
  rpc MuteConversation(MuteConversationRequest) returns (Conversation);
  // Sets or clears archived_at. Archiving does not clear pinned_rank — a pinned+archived conversation
  // stays pinned inside the archive view.
  rpc SetConversationArchived(SetConversationArchivedRequest) returns (Conversation);
  // Sets marked_unread=true regardless of the real read pointer. Cleared by the next MarkAsRead.
  rpc MarkConversationUnread(MarkConversationUnreadRequest) returns (google.protobuf.Empty);
  // Redis-throttled (SET NX EX 4 per conversation+thread+user): publishes typing.started to every OTHER
  // member only on the first call within a given 4s window, so a chatty client can safely call this
  // every keystroke. No DB write, nothing persisted.
  rpc SendTypingIndicator(SendTypingIndicatorRequest) returns (google.protobuf.Empty);
  // Pinned messages — any conversation member may pin/unpin (collaborative tier, like reactions).
  rpc PinMessage(PinMessageRequest) returns (google.protobuf.Empty);
  rpc UnpinMessage(UnpinMessageRequest) returns (google.protobuf.Empty);
  rpc ListPinnedMessages(ListPinnedMessagesRequest) returns (ListPinnedMessagesResponse); // chronological, any member

  // ── Paste-driven internal re-reference (Flow B for Chat) ──
  // Links a file the caller already has read access to (verified against source_kind/source_id —
  // MESSAGE checked locally the same way GetAttachmentDownloadUrl does, PAGE/TASK delegated to the
  // owning service's own equivalent check) into a not-yet-sent message draft's pending attachment
  // set, without re-uploading. Registered against a client-generated draft_id (CHAT_MESSAGE_DRAFT
  // owner in File Service) rather than the message directly, since the message doesn't exist until
  // Send — mirrors doc-service's DOC_PAGE_DRAFT pattern.
  rpc ReferenceExistingFileForDraft(ReferenceExistingFileForDraftRequest) returns (ReferenceExistingFileForDraftResponse);
  // Wholesale-revokes every reference the given draft holds — called on composer cancel/unmount-
  // without-send so abandoned pasted-in files become GC-eligible. A no-op (not an error) if the draft
  // never referenced anything.
  rpc RevokeDraftReferences(RevokeDraftReferencesRequest) returns (google.protobuf.Empty);

  // Group channels only — rejected server-side on a DIRECT conversation. Requires channel
  // OWNER/ADMIN or channel.manage. Caller identity comes from the gRPC principal, never the body.
  rpc SetConversationAvatar(SetConversationAvatarRequest) returns (Conversation);
  rpc RemoveConversationAvatar(RemoveConversationAvatarRequest) returns (Conversation);

  // ── Staff-tier (admin panel) ──────────────────────────────────────────────────────────────
  // Any active staff member or trusted internal service may call this — no live platform_staff
  // re-check, same accepted read-only trust level as every other staff-tier READ this admin-panel
  // effort has built. A live COUNT joined through messages -> conversations (Message has no org_id
  // of its own; Conversation does) — accepted as a live-COUNT admin-panel read for now, same as
  // every other staff count RPC added alongside this one; revisit with a maintained counter if
  // this ever becomes a hot path (chat is this platform's highest-volume table).
  rpc GetMessageCountForStaff(GetMessageCountForStaffRequest) returns (GetMessageCountForStaffResponse);
}

message UpdateChannelDescriptionRequest {
  string conversation_id = 1;
  string description = 2; // blank clears it
}

message UpdateChannelNameRequest {
  string conversation_id = 1;
  string name = 2;
}

message PinMessageRequest {
  string message_id = 1;
}

message UnpinMessageRequest {
  string message_id = 1;
}

message ListPinnedMessagesRequest {
  string conversation_id = 1;
}

message ListPinnedMessagesResponse {
  repeated Message messages = 1; // chronological by when pinned
}

message PingRequest {
  string message = 1;
}

message PingResponse {
  string message = 1;
  // Echoes the user id the server read from x-user-id metadata (identity forwarded by the Gateway).
  // Scaffold-only: lets us verify identity propagation before real chat RPCs exist.
  string user_id = 2;
}

// ===================== Conversations + membership =====================

message ConversationMember {
  string user_id = 1;
  string role = 2;       // OWNER / ADMIN / MEMBER
  string added_by = 3;   // empty if not recorded (e.g. the creator's own OWNER row)
  google.protobuf.Timestamp joined_at = 4;
}

message Conversation {
  string id = 1;
  string org_id = 2;
  string type = 3;        // CHANNEL / DIRECT
  string name = 4;        // empty for DIRECT
  string created_by = 5;
  google.protobuf.Timestamp created_at = 6;
  repeated ConversationMember members = 7;
  string description = 9; // channel topic; empty for DMs / undescribed channels (field 8 = unread_count below)
  // Main-feed messages (thread_root_message_id IS NULL, not soft-deleted) created after the
  // caller's read_states pointer for this conversation — 0 once caught up, full count if never
  // opened. Only ListMyConversations computes this for real; other RPCs that return a Conversation
  // (CreateGroupChannel, GetConversation) send 0, which happens to be correct for a brand-new
  // channel but is a stub elsewhere — not part of this feature's scope.
  int64 unread_count = 8;
  string avatar_version = 10; // CHANNEL only; empty for DIRECT (resolved client-side to the other member's user avatar)

  // Chat-list sort/preview/caller state. Filled by ListMyConversations and GetConversation for the
  // CALLER; every other RPC that returns a Conversation leaves 14-19 at their defaults (not-pinned,
  // not-muted, not-archived, not-marked-unread, no read pointer) since they don't load the caller's
  // membership row for this purpose.
  google.protobuf.Timestamp last_activity_at = 11; // latest main-feed message's created_at, or the
                                                    // conversation's own created_at if it has none yet
  optional MessagePreview last_message = 12;       // absent for an empty conversation
  int64 unread_mention_count = 13;                 // ListMyConversations only; same visibility rule as
                                                    // unread_count (main feed, after the read pointer)
  optional int32 pinned_rank = 14;                 // absent = not pinned; lower = higher in the pinned block
  optional google.protobuf.Timestamp muted_until = 15; // absent = not muted; 'infinity' = muted forever
  bool archived = 16;
  bool marked_unread = 17;
  optional string last_read_message_id = 18;
  optional string last_read_cursor = 19;           // same opaque keyset codec as Message.cursor
}

// Deliberately not a full Message: no reactions, no attachments list, no seen-computation beyond the
// one caller-relative bit below. Just enough for a chat-list row.
message MessagePreview {
  string id = 1;
  string sender_id = 2;
  string plain_text = 3;                  // server-flattened, <=140 chars — see PreviewTextExtractor
  optional string first_attachment_name = 4;
  int32 attachment_count = 5;
  google.protobuf.Timestamp created_at = 6;
  bool deleted = 7;
  bool seen = 8;                          // meaningful only when sender_id == caller (✓ vs ✓✓)
}

message CreateGroupChannelRequest {
  string org_id = 1;
  string name = 2;
  repeated string initial_member_user_ids = 3;
}

message AddConversationMemberRequest {
  string conversation_id = 1;
  string user_id = 2;
}

message RemoveConversationMemberRequest {
  string conversation_id = 1;
  string user_id = 2;
}

message TransferOwnershipRequest {
  string conversation_id = 1;
  string new_owner_user_id = 2;
}

message ListMyConversationsRequest {
  string org_id = 1;
}

message ListMyConversationsResponse {
  repeated Conversation direct_conversations = 1;
  repeated Conversation group_conversations = 2;
}

message ListConversationsForUserRequest {
  string org_id = 1;
  string user_id = 2; // target member, not the caller
}

message ListConversationsForUserResponse {
  repeated Conversation group_conversations = 1;
}

message GetConversationRequest {
  string conversation_id = 1;
}

// ===================== Messages, threads, reactions, mentions, read state =====================

message Message {
  string id = 1;
  string conversation_id = 2;
  string sender_id = 3;
  string content = 4;                          // client-supplied JSON, stored/returned opaquely
  optional string reply_to_message_id = 5;      // simple in-feed reply; independent of thread_root
  optional string thread_root_message_id = 6;   // thread reply; independent of reply_to
  bool is_thread_root = 7;                      // set on the root once it has at least one reply
  google.protobuf.Timestamp created_at = 8;
  optional google.protobuf.Timestamp edited_at = 9;
  optional google.protobuf.Timestamp deleted_at = 10; // presence = soft-deleted; content still returned
  repeated string mentioned_user_ids = 11;
  repeated MessageAttachment attachments = 12;
  // Grouped by emoji (each with the set of users who reacted with it) — this is the shape a
  // reaction-pill UI needs directly (emoji + count + who), not a flat per-reaction list. Populated
  // by ListMessages/ListThreadReplies (batch-fetched); empty on SendMessage's response (a brand-new
  // message has none yet) and on EditMessage/DeleteMessage's responses (out of scope for this pass).
  repeated MessageReaction reactions = 13;
  // Read receipt for the SENDER's own view: true once at least one OTHER conversation member has
  // read up to this message (message.created_at <= the latest last_read_at among non-sender members).
  // Computed per-conversation on the ListMessages/ListThreadReplies read paths; SendMessage's
  // immediate response leaves it false (nothing's been read yet at send time).
  bool seen = 14;
  // Opaque keyset cursor for THIS message (server-encoded (created_at, id)). Lets a client that holds a
  // message page both directions from it — e.g. click a mention/linked message, then ListMessages with
  // this cursor + direction=BACKWARD (older) and =FORWARD (newer). Clients never parse it.
  string cursor = 15;
  // Echoes the client_message_id from the SendMessageRequest that created this message (whether this
  // response came from the original insert or an idempotent replay). Absent for messages sent before
  // this field existed, or without one supplied.
  optional string client_message_id = 16;
}

message MessageReaction {
  string emoji = 1;
  repeated string user_ids = 2;
}

message MessageAttachment {
  string id = 1;
  string file_id = 2;
  string file_name = 3;
  string mime_type = 4;      // resolved from File Service (GetFile)
  int64 size_bytes = 5;      // resolved from File Service (GetFile)
  // Short-lived presigned GET URL, populated only on read paths (ListMessages/ListThreadReplies) for
  // convenience; empty on SendMessage's response and its message.created/edited events (clients fetch
  // a fresh URL on demand via GetAttachmentDownloadUrl, which re-checks message-scoped permission).
  string download_url = 6;
}

message DirectMessageTarget {
  string org_id = 1;
  string recipient_user_id = 2;
}

message SendMessageRequest {
  oneof target {
    string conversation_id = 1;
    DirectMessageTarget direct_message_target = 2;
  }
  string content = 3;
  optional string reply_to_message_id = 4;
  optional string thread_root_message_id = 5;
  repeated string mentioned_user_ids = 6;
  // Parallel arrays, same length. Each file_id is validated against File Service before anything is
  // written (must exist, belong to this conversation's org, be ACTIVE) — Chat Service is the trust
  // boundary, not a passthrough.
  repeated string attachment_file_ids = 7;
  repeated string attachment_file_names = 8;
  // When true, server resolves every current conversation member and mentions each of them (union'd
  // with mentioned_user_ids, deduplicated) rather than the caller enumerating the member list.
  bool mention_everyone = 9;
  // The composer's client-generated draft id, if any ReferenceExistingFileForDraft calls happened
  // during composition — lets the server revoke the now-superseded CHAT_MESSAGE_DRAFT reference once
  // the permanent MESSAGE reference is registered below. Absent when nothing was ever pasted in.
  optional string draft_id = 10;
  // Client-generated UUID for send idempotency. A second SendMessage with the same (caller, id) —
  // e.g. a retry after a timed-out response — returns the ALREADY-CREATED message unchanged and
  // publishes nothing new, instead of creating a duplicate. Absent = no idempotency check (legacy
  // callers / server-initiated sends, if any).
  optional string client_message_id = 11;
}

message EditMessageRequest {
  string message_id = 1;
  string content = 2;
}

message DeleteMessageRequest {
  string message_id = 1;
}

message GetMessageRequest {
  string message_id = 1;
}

message ListMessagesRequest {
  string conversation_id = 1;
  // Keyset on (created_at, id). Natural default direction = BACKWARD (older than cursor); empty cursor
  // = most recent page. FORWARD pages toward newer — used to jump to a linked/mentioned message and
  // read both ways from it.
  .org.sophie.common.PageRequest page = 2;
}

message ListMessagesResponse {
  repeated Message messages = 1; // always returned ascending by created_at (oldest first) for display
  .org.sophie.common.PageResponse page = 2;
}

message ListThreadRepliesRequest {
  string thread_root_message_id = 1;
  // Keyset on (created_at, id). Natural default direction = FORWARD (older→newer within the thread).
  .org.sophie.common.PageRequest page = 2;
}

message ListThreadRepliesResponse {
  repeated Message replies = 1; // ascending by created_at (oldest first, newest last)
  .org.sophie.common.PageResponse page = 2;
}

message AddReactionRequest {
  string message_id = 1;
  string emoji = 2;
}

message RemoveReactionRequest {
  string message_id = 1;
  string emoji = 2;
}

message GetAttachmentDownloadUrlRequest {
  string message_id = 1;
  string file_id = 2;
  reserved 3; // was: requested_by (phase-2 identity field, deleted)
  reserved "requested_by";
}

message GetAttachmentDownloadUrlResponse {
  string download_url = 1;
  int32 expires_in_seconds = 2;
}

message ReferenceExistingFileForDraftRequest {
  string draft_id = 1;
  string file_id = 2;
  // "PAGE" | "MESSAGE" | "TASK" — which service's access model source_id must be verified against.
  string source_kind = 3;
  string source_id = 4;
  // Display-only — used only in an error toast if the request is rejected; canonical name/mime/size
  // are always re-resolved from File Service's own GetFile, never trusted from the request.
  string file_name = 5;
  // The org this draft's eventual message belongs to — the client already has this (same prop the
  // composer's own upload flow uses); required because a not-yet-sent draft may have no conversation
  // yet (a fresh DM compose), so there's no conversation row to derive it from server-side. Checked
  // against the file's own canonical org (from File Service's GetFile), never trusted on its own.
  string org_id = 6;
}

message ReferenceExistingFileForDraftResponse {
  string file_id = 1;
  string file_name = 2;
  string mime_type = 3;
  int64 size_bytes = 4;
}

message RevokeDraftReferencesRequest {
  string draft_id = 1;
}

message MarkAsReadRequest {
  string conversation_id = 1;
  optional string last_read_message_id = 2;
}

// ===================== Per-user chat-list state =====================

message SetConversationPinnedRequest {
  string conversation_id = 1;
  bool pinned = 2;
}

message ReorderPinnedConversationsRequest {
  string org_id = 1;
  repeated string conversation_ids = 2; // full ordered list of the caller's pinned conversations in org_id
}

message MuteConversationRequest {
  string conversation_id = 1;
  optional google.protobuf.Timestamp muted_until = 2;
  bool forever = 3;
}

message SetConversationArchivedRequest {
  string conversation_id = 1;
  bool archived = 2;
}

message MarkConversationUnreadRequest {
  string conversation_id = 1;
}

message SendTypingIndicatorRequest {
  string conversation_id = 1;
  optional string thread_root_message_id = 2;
}

// ===================== Realtime event envelope =====================
// Not part of the RPC surface. JSON-serialized (via protobuf JsonFormat) and PUBLISHed to
// `user:{userId}:events` for every affected conversation member — websocket-service relays it
// opaquely (it doesn't parse this), the frontend is the only real consumer.

message ChatEvent {
  // message.created / message.edited / message.deleted / reaction.added / reaction.removed /
  // read_state.updated / typing.started / conversation.state_updated / read_state.self_updated
  string type = 1;
  string conversation_id = 2;
  optional Message message = 3;
  optional ReactionEvent reaction = 4;
  optional ReadStateEvent read_state = 5;
  // typing.started only. Published to every OTHER conversation member (never the typist).
  optional TypingEvent typing = 6;
  // conversation.state_updated only. The full caller-scoped Conversation (fields 11-19 filled),
  // published to the CALLER's own channel only, so their other devices sync pin/mute/archive/unread.
  optional Conversation conversation = 7;
  // read_state.self_updated only. Published to the CALLER's own channel only, so their other devices
  // clear read badges without a refetch.
  optional ReadStateSelfEvent read_state_self = 8;
}

message TypingEvent {
  string user_id = 1;
  optional string thread_root_message_id = 2; // absent = typing in the main feed
}

message ReadStateSelfEvent {
  string conversation_id = 1;
  optional string last_read_message_id = 2;
  optional string last_read_cursor = 3;
  google.protobuf.Timestamp last_read_at = 4;
}

message ReactionEvent {
  string message_id = 1;
  string user_id = 2;
  string emoji = 3;
}

// Published (read_state.updated) to the OTHER conversation members when a reader calls MarkAsRead,
// so a sender's open client can flip its checkmarks from sent to seen live, without a refetch.
message ReadStateEvent {
  string conversation_id = 1;
  string reader_user_id = 2;                 // who just read; never the recipients of this event
  google.protobuf.Timestamp last_read_at = 3; // the reader's new read-through timestamp
}

// ===================== Notification Service integration =====================
// JSON shapes Chat Service builds when calling Notification Service's CreateNotification —
// serialized via protobuf JsonFormat (same technique as ChatEvent above) into
// source_reference/payload, which Notification Service stores and returns opaquely. Not part of
// ChatService's own RPC surface.

message MentionSourceReference {
  string conversation_id = 1;
  string message_id = 2;
}

message ThreadReplySourceReference {
  string conversation_id = 1;
  string thread_root_message_id = 2;
  string message_id = 3;
}

message DirectMessageSourceReference {
  string conversation_id = 1;
  string message_id = 2;
}

message ChatNotificationPayload {
  string sender_id = 1;
  string content_preview = 2; // Plain text, not raw content JSON: MessageService flattens the TipTap
                               // document (mentions rendered as "@label", blocks newline-joined) and
                               // truncates AFTER flattening, so this never contains partial JSON.
                               // See MessageService.contentPreview()/plainText()/walkForText().
}

message SetConversationAvatarRequest {
  string conversation_id = 1;
  string source_file_id = 2;   // an ACTIVE file the caller uploaded, in this conversation's org
}

message RemoveConversationAvatarRequest {
  string conversation_id = 1;
}

message GetMessageCountForStaffRequest {
  string org_id = 1;
}

message GetMessageCountForStaffResponse {
  int64 count = 1;
}
