syntax = "proto3";

package com.platform.imports.v1;

option java_multiple_files = true;
option java_package = "org.sophie.importservice.grpc";

import "google/protobuf/timestamp.proto";

// Import Service: one-time imports of Jira (and later Confluence) into Tasks and Docs
// (claude/atlassian-import-design.md). The Gateway calls these on behalf of a signed-in Org Admin; every
// RPC takes the org_id it acts in and refuses anyone who is not that org's admin. The long work runs in
// import-service's own background worker, which writes through task-service's and doc-service's Import*
// RPCs. The Atlassian credential is accepted once, stored encrypted, never returned, and wiped when the
// job ends.
service ImportService {
  // Validates the credential against the Atlassian site, stores it encrypted and queues discovery.
  rpc CreateImportJob(CreateImportJobRequest) returns (ImportJob);
  rpc GetImportJob(GetImportJobRequest) returns (ImportJob);
  rpc ListImportJobs(ListImportJobsRequest) returns (ListImportJobsResponse); // newest first
  // The choices the admin makes between discovery and start: what to bring, who is who, what maps to what.
  rpc GetImportMapping(GetImportMappingRequest) returns (ImportMapping);
  rpc UpdateImportMapping(UpdateImportMappingRequest) returns (ImportMapping);
  // Atlassian's user export (admin.atlassian.com → Users → Export users) — Cloud hides most emails, and
  // this CSV is where they are (§9). Re-runs people matching with it.
  rpc ApplyPeopleCsv(ApplyPeopleCsvRequest) returns (ImportMapping);
  rpc StartImportJob(ImportJobActionRequest) returns (ImportJob);   // refused while a preflight check BLOCKs
  rpc PauseImportJob(ImportJobActionRequest) returns (ImportJob);
  // Optionally with a replacement token (the old one was revoked or expired).
  rpc ResumeImportJob(ResumeImportJobRequest) returns (ImportJob);
  rpc CancelImportJob(ImportJobActionRequest) returns (ImportJob);  // what was written stays
  // What was not imported, and why — the report screen and its CSV.
  rpc ListImportReportItems(ListImportReportItemsRequest) returns (ListImportReportItemsResponse);
}

message CreateImportJobRequest {
  string org_id = 1;
  string source = 2;               // CLOUD (DATA_CENTER arrives in Phase 3)
  string base_url = 3;             // https://<site>.atlassian.net
  string email = 4;                // the Atlassian account the API token belongs to
  string api_token = 5;            // never returned, never logged
  repeated string products = 6;    // JIRA (CONFLUENCE arrives in Phase 2)
}

message GetImportJobRequest {
  string org_id = 1;
  string job_id = 2;
}

message ListImportJobsRequest {
  string org_id = 1;
}

message ListImportJobsResponse {
  repeated ImportJob jobs = 1;
}

message ImportJob {
  string id = 1;
  string org_id = 2;
  string created_by = 3;
  string source = 4;
  string base_url = 5;
  repeated string products = 6;
  // DRAFT | DISCOVERING | AWAITING_MAPPING | RUNNING | PAUSED | COMPLETED | COMPLETED_WITH_WARNINGS
  // | FAILED | CANCELLED
  string status = 7;
  string pause_reason = 8;         // RATE_LIMITED | QUOTA | CREDENTIAL_INVALID | ADMIN_REVOKED | USER
  string phase = 9;                // what the worker is on, e.g. ISSUES:PROJ
  string last_error = 10;          // a sentence for the admin, never a stack trace
  ImportDiscovery discovery = 11;
  repeated ImportCounter counters = 12;
  repeated PreflightCheck preflight = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp started_at = 15;
  google.protobuf.Timestamp finished_at = 16;
  bool credential_wiped = 17;      // true once the token is gone (terminal states, or 7 days idle)
  string account_name = 18;        // the Atlassian account the token belongs to, as Atlassian names it
}

message ImportDiscovery {
  repeated DiscoveredProject projects = 1;
  int32 people = 2;
  int32 custom_fields = 3;         // fields with at least one value in the visible projects
  int64 attachment_bytes = 4;
  bool attachment_bytes_estimated = 5; // sampled rather than summed (very large sites)
  int32 visible_projects = 6;      // what this token can see …
  int32 total_projects = 7;        // … against what the site has; a gap means the token is not an admin's
}

message DiscoveredProject {
  string jira_id = 1;
  string key = 2;
  string name = 3;
  string board_type = 4;           // scrum | kanban | none
  int32 issue_count = 5;
  int64 attachment_bytes = 6;
}

message ImportCounter {
  string kind = 1;                 // PROJECT | ISSUE | COMMENT | ATTACHMENT | SPRINT | FIELD | PERSON
  int32 total = 2;
  int32 done = 3;
  int32 skipped = 4;
  int32 failed = 5;
}

message PreflightCheck {
  string key = 1;                  // e.g. tasks.projects.max, storage.total.gb, seats.max, file.max.mb
  string level = 2;                // OK | WARN | BLOCK
  string message = 3;              // English fallback; the web renders by key
  int64 needed = 4;
  int64 available = 5;             // -1 = unlimited
}

message GetImportMappingRequest {
  string org_id = 1;
  string job_id = 2;
}

message ImportMapping {
  string job_id = 1;
  repeated ProjectChoice projects = 2;
  repeated PersonChoice people = 3;
  repeated ValueChoice values = 4;
  ImportOptions options = 5;
  int32 version = 6;               // send it back on update; a stale version is refused (two tabs)
}

message ProjectChoice {
  string jira_id = 1;
  string jira_key = 2;
  string name = 3;
  bool selected = 4;
  string sophie_key = 5;           // defaults to jira_key when it fits Sophie's key rules
  string template_key = 6;         // kanban | scrum | waterfall
  string access = 7;               // WORKSPACE (every member) | MAPPED_MEMBERS
  int32 issue_count = 8;
  string key_problem = 9;          // empty | INVALID | TAKEN — the admin must pick another sophie_key
}

message PersonChoice {
  string account_id = 1;           // Atlassian accountId
  string display_name = 2;
  string email = 3;                // empty when Atlassian hides it and no CSV supplied it
  bool active = 4;                 // false = deactivated in Atlassian; defaults to ATTRIBUTE
  string action = 5;               // MAP | INVITE | ATTRIBUTE
  string sophie_user_id = 6;       // MAP target (an org member)
  string suggested_user_id = 7;    // what matching proposed; never applied without the admin
  string suggestion = 8;           // EMAIL | CSV | NAME — how it was found; NAME is only ever a suggestion
  int32 item_count = 9;            // issues + comments that name them
}

// One source value and what it becomes. `target` vocabulary per kind:
//   ISSUE_TYPE  system:<task|bug|story|subtask|epic> | type:<org task type id> | create | skip
//   STATUS      TODO | IN_PROGRESS | DONE   (scope = project key; every status is created per project)
//   PRIORITY    HIGHEST | HIGH | MEDIUM | LOW | LOWEST
//   FIELD       create:<CustomField type> | field:<org field id> | story_points | start_date | skip
message ValueChoice {
  string kind = 1;
  string external_id = 2;
  string external_name = 3;
  string scope = 4;
  string target = 5;
  string detail = 6;               // why a default was chosen, or why a value cannot come across
  int32 usage = 7;
}

message ImportOptions {
  bool attachments = 1;            // default true
  bool archived_issues = 2;        // default true
  bool secured_issues = 3;         // default false — §12.1: imported visible to the whole project
  bool deactivated_people_as_attribution = 4; // default true
}

// Only the rows listed change, matched by their key (jira_id / account_id / kind+scope+external_id).
message UpdateImportMappingRequest {
  string org_id = 1;
  string job_id = 2;
  int32 version = 3;
  repeated ProjectChoice projects = 4;
  repeated PersonChoice people = 5;
  repeated ValueChoice values = 6;
  optional ImportOptions options = 7;
}

message ApplyPeopleCsvRequest {
  string org_id = 1;
  string job_id = 2;
  string csv = 3;                  // the export's text, at most 5 MiB
}

message ImportJobActionRequest {
  string org_id = 1;
  string job_id = 2;
}

message ResumeImportJobRequest {
  string org_id = 1;
  string job_id = 2;
  optional string api_token = 3;   // replaces the stored one; same account required
}

message ListImportReportItemsRequest {
  string org_id = 1;
  string job_id = 2;
  string state = 3;                // SKIPPED | FAILED | empty = both
  string page_token = 4;
  int32 page_size = 5;             // default 100, max 500
}

message ListImportReportItemsResponse {
  repeated ImportReportItem items = 1;
  string next_page_token = 2;
  repeated ReasonCount reasons = 3; // totals over the whole job, for the grouped warnings view
}

message ImportReportItem {
  string kind = 1;
  string external_key = 2;         // PROJ-123, a filename, a field name
  string state = 3;
  string reason = 4;               // OVERSIZE_FILE | BLOCKED_EXTENSION | RESTRICTED | QUOTA | SOURCE_404 | ...
  string detail = 5;
  string source_url = 6;           // the item in Atlassian, so nothing is unreachable while it stays up
}

message ReasonCount {
  string reason = 1;
  int32 count = 2;
}
