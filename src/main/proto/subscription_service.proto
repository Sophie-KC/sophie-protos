syntax = "proto3";

package com.platform.subscription.v1;

option java_multiple_files = true;
option java_package = "org.sophie.subscriptionservice.grpc";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";
import "common/pagination.proto";

// Subscription Service: owns plans, prices, entitlements, and the per-org subscription lifecycle.
// Entitlement checks are on the hot path of every module (invite a member, upload a file, create a
// project) — EntitlementService is the surface every service should actually call; consumers are
// expected to cache the resolved map rather than hit CheckEntitlement per key. gRPC-only, internal
// service-to-service — no caller-identity check here, the caller is trusted to pass the right org_id
// (same trust model as File Service).
//
// PlanAdminService / SubscriptionAdminService / PlatformMetricsService (staff-only surfaces) are
// declared in this file so the wire contract is stable across phases, but are not implemented by
// subscription-service until the platform-staff-auth phase — calling them today returns UNIMPLEMENTED.
service EntitlementService {
  // The call every consuming service should actually make: the whole resolved map for an org, meant
  // to be cached (Redis + a local near-cache) rather than re-fetched per key.
  rpc GetEntitlements (GetEntitlementsRequest) returns (EntitlementMap);
  // Single-key convenience, mainly for callers that don't want to hold a cache themselves yet.
  rpc CheckEntitlement (CheckEntitlementRequest) returns (EntitlementCheck);
  // Seat-specific check used by org-service's invite path. NOTE: this is a read — the actual
  // enforcement must still happen inside the caller's own transaction (advisory lock + count +
  // insert atomically) to avoid a race between two concurrent invites; this RPC alone is not
  // sufficient to prevent overselling seats.
  rpc CheckSeatAvailable (CheckSeatAvailableRequest) returns (SeatCheck);
}

service SubscriptionService {
  rpc GetSubscription (GetSubscriptionRequest) returns (Subscription);
  // Called synchronously from org-service's signup saga (primary path) and, idempotently, from an
  // org.created event consumer as a reconciliation fallback. Returns the existing subscription
  // unchanged if the org already has one.
  rpc CreateFreeSubscription (CreateFreeSubscriptionRequest) returns (Subscription);
  rpc ListPlans (ListPlansRequest) returns (ListPlansResponse);

  // No-write preview of what ChangePlan would do — same calculator ChangePlan itself calls, so the
  // number a customer confirms and the number on the resulting invoice can never disagree (Phase 2
  // prompt §5.1).
  rpc PreviewPlanChange  (ChangePlanRequest)         returns (PlanChangePreview);
  rpc ChangePlan         (ChangePlanRequest)         returns (ChangePlanResponse);
  rpc CancelSubscription (CancelSubscriptionRequest) returns (Subscription);
  rpc ResumeSubscription (ResumeSubscriptionRequest) returns (Subscription);

  // Dev/test-only: resets an org's subscription back to a clean Free-tier state (plan, billing
  // period, period dates, status, seats_purchased) so a hand-verification org (e.g. e2e's "acme")
  // can be re-used to exercise Free-tier limits after being upgraded during manual testing.
  // subscription-service refuses this call outright unless it was started with
  // sophie.subscription.dev-reset-enabled=true (never true in production defaults) — the RPC itself
  // does not exist on the server when that property is unset, so this returns UNIMPLEMENTED rather
  // than doing anything in any environment that hasn't explicitly opted in.
  rpc DevResetOrgToFree (DevResetOrgToFreeRequest) returns (google.protobuf.Empty);
}

// ── EntitlementService messages ─────────────────────────────────────────────

message GetEntitlementsRequest {
  string org_id = 1;
}

message EntitlementMap {
  map<string, EntitlementValue> entitlements = 1;
  string subscription_status = 2;   // ACTIVE | PAST_DUE | GRACE | SUSPENDED | CANCELED | EXPIRED | TRIALING
  AccessMode access_mode = 3;
}

enum AccessMode {
  ACCESS_MODE_UNSPECIFIED = 0;
  FULL = 1;
  READ_ONLY = 2;
}

message EntitlementValue {
  bool is_unlimited = 1;
  int64 number_value = 2;
  bool bool_value = 3;
  EntitlementSource source = 4;
}

enum EntitlementSource {
  ENTITLEMENT_SOURCE_UNSPECIFIED = 0;
  PLAN = 1;
  OVERRIDE = 2;
  DEFAULT = 3;
}

message CheckEntitlementRequest {
  string org_id = 1;
  string key = 2;
}

message EntitlementCheck {
  bool allowed = 1;
  bool is_unlimited = 2;
  int64 limit = 3;
}

message CheckSeatAvailableRequest {
  string org_id = 1;
  int32 additional = 2;
}

message SeatCheck {
  bool allowed = 1;
  int64 current = 2;
  int64 max = 3;      // Long.MAX_VALUE-equivalent (int64 max) when unlimited
}

// ── SubscriptionService messages ────────────────────────────────────────────

message GetSubscriptionRequest {
  string org_id = 1;
}

message CreateFreeSubscriptionRequest {
  string org_id = 1;
}

message ListPlansRequest {
  bool include_private = 1;
}

message ListPlansResponse {
  repeated Plan plans = 1;
}

message Plan {
  string id = 1;
  string code = 2;              // FREE | PRO | BUSINESS
  string name = 3;
  string description = 4;
  int32 tier_rank = 5;
  bool is_free = 6;
  bool is_public = 7;
  repeated PlanPrice prices = 8;
  // Phase 3 closeout §3.2: this plan's own entitlement limits (default + plan-overlay resolution,
  // same EntitlementValue shape GetEntitlements returns) — no org, no override layer, no
  // subscription_status/access_mode, since a bare catalog entry has neither. Lets the Plan Comparison
  // modal read real limits instead of hand-mirroring the seed SQL, which drifts the first time a plan
  // changes.
  map<string, EntitlementValue> entitlements = 9;
}

message PlanPrice {
  string id = 1;
  string billing_period = 2;    // MONTHLY | ANNUAL
  string currency = 3;
  string amount_per_seat = 4;   // decimal string — never a float/double on the wire
  int32 min_seats = 5;
  // Fields 6-9 are populated ONLY by PricingAdminService's staff responses — SubscriptionService's
  // own customer-facing ListPlans never sets them (change_reason/created_by_user_id are internal
  // admin notes, not customer-visible data). Reusing this message rather than a parallel staff-only
  // one because every other field is identical and already real either way.
  optional google.protobuf.Timestamp valid_from = 6;
  optional google.protobuf.Timestamp valid_to = 7;
  optional string change_reason = 8;
  optional string created_by_user_id = 9;
  // Real aggregate over subscriptions currently pinned to THIS price row (Subscription.plan_price_id)
  // — meaningful even for a closed (valid_to set) row, since a grandfathered org can still be pinned
  // to an old price. Staff-only, same reason as above.
  optional int32 org_count = 10;
  optional string mrr_contribution = 11; // decimal string, monthly-equivalent
  // Staff-only, same reason as above — the customer path never needs it, since a PlanPrice there is
  // always already nested inside its own parent Plan.prices. PricingAdminService.ListPlanPrices
  // returns a FLAT list with no such parent, so the row needs to carry its own plan code.
  optional string plan_code = 12;
}

message Subscription {
  string id = 1;
  string org_id = 2;
  string plan_id = 3;
  string plan_code = 4;
  optional string plan_price_id = 5;
  string billing_period = 6;    // MONTHLY | ANNUAL | NONE
  string status = 7;            // TRIALING | ACTIVE | PAST_DUE | GRACE | SUSPENDED | CANCELED | EXPIRED
  int32 seats_purchased = 8;
  int32 seats_in_use = 9;
  google.protobuf.Timestamp current_period_start = 10;
  google.protobuf.Timestamp current_period_end = 11;
  bool cancel_at_period_end = 12;
  // Set by CancelSubscription only, when the org has more members than the plan it will drop to (Free)
  // supports — the UI must surface this at confirm time (Phase 2 prompt §5.3): at period end the
  // workspace goes read-only unless members are removed first.
  bool excess_members_on_cancel_warning = 13;
}

// ── ChangePlan / PreviewPlanChange / CancelSubscription / ResumeSubscription ────────────────────

// Phase 3 closeout §2: ChangePlan's invoice is created asynchronously (the outbox guarantee is worth
// more than a synchronous call — see subscription.invoice_requested below), so the response can't
// carry the invoice itself. invoice_request_id is the correlation id the caller polls
// GetInvoiceByRequestId with until the async consumer has created the real invoice. Unset when this
// plan change didn't request an invoice at all (a scheduled downgrade, or an immediate change with no
// billable lines) — there is nothing to poll for.
message ChangePlanResponse {
  Subscription subscription = 1;
  optional string invoice_request_id = 2;
}

message ChangePlanRequest {
  string org_id = 1;
  string plan_code = 2;
  string billing_period = 3;    // MONTHLY | ANNUAL
  int32 seats = 4;
  optional string actor_user_id = 5;   // staff bypass of is_public omits this
}

message PlanChangePreview {
  string target_plan_code = 1;
  string billing_period = 2;
  int32 seats = 3;
  google.protobuf.Timestamp period_start = 4;
  google.protobuf.Timestamp period_end = 5;
  repeated PlanChangeLine lines = 6;
  string subtotal_amount = 7;      // decimal string
  string tax_amount = 8;           // decimal string
  string total_amount = 9;         // decimal string
  optional google.protobuf.Timestamp due_at = 10;
  // When true, none of the fields above are meaningful — ChangePlan with the same request would be
  // rejected FAILED_PRECONDITION. seats.max is below current_member_count (Phase 2 prompt §5.3).
  bool blocked = 11;
  string blocked_reason = 12;
  optional int64 current_member_count = 13;
  optional int64 max_seats = 14;
  optional int64 excess_seats = 15;
}

message PlanChangeLine {
  string line_type = 1;      // SEAT | PRORATION
  string description = 2;
  string quantity = 3;       // decimal string
  string unit_amount = 4;    // decimal string, may be negative (PRORATION credit)
  string tax_percentage = 5; // decimal string
}

message CancelSubscriptionRequest {
  string org_id = 1;
  bool at_period_end = 2;
  optional string actor_user_id = 3;
}

message ResumeSubscriptionRequest {
  string org_id = 1;
  optional string actor_user_id = 2;
}

// Dev/test-only — see DevResetOrgToFree above.
message DevResetOrgToFreeRequest {
  string org_id = 1;
}

// ── Staff-only admin surfaces (contract reserved, not yet implemented) ─────

// PlanAdminService: the admin panel's Plans screen — an entitlement-MATRIX editor (FREE/PRO/BUSINESS
// x entitlement keys), not a plan-catalog CRUD surface (SubscriptionService.ListPlans already covers
// reading plan/price/entitlement data, and is already reachable by a StaffPrincipal — it's a global,
// non-org-scoped catalog read with no staff-specific gate). GetPlanMatrix duplicates none of that:
// it returns the SAME per-plan resolved entitlement values (via EntitlementResolver, the identical
// logic ListPlans itself calls) reshaped into the {keys, matrix} form the admin-web Plans screen
// renders, PLUS the entitlement_key catalog's own metadata (description/valueType/enforcingService),
// which ListPlans's response has no room for and no other RPC exposes at all.
//
// GetPlanMatrix follows the same staff-tier read pattern as SubscriptionAdminService/
// BillingAdminService: any ServicePrincipal or StaffPrincipal, no live platform_staff re-check
// (read-only, low-severity, same accepted gap).
//
// UpdatePlanEntitlements/CreateEntitlementKey are different: real writes with real platform-wide
// consequence, so they hold a NEW, stricter bar this admin-panel effort hasn't needed until now —
// StaffPrincipal ONLY (no ServicePrincipal bypass; no legitimate internal service ever mutates the
// entitlement matrix on its own), AND a live re-check against org-service's platform_staff table
// (via GetOrgSeatCount's sibling ListStaff RPC, reached through the SAME raw-JWT auto-forwarding
// every other cross-service call on this platform already relies on — see
// sophie-common-security's IdentityForwardingClientInterceptor) requiring the caller be an ACTIVE
// PLATFORM_ADMIN, never trusting the StaffPrincipal JWT's own role claim alone (mirrors org-service's
// own StaffAuth.requirePlatformAdmin() precedent for its Staff-management RPCs). Both writes also
// append a real admin_audit_log row (that table has existed, unmapped, since V1 — Audit Log itself
// stays out of scope for this pass, so nothing reads these rows back yet, but every write from this
// point on leaves a genuine trail for whenever that module gets wired).
//
// Every cell value on the wire is a plain string, matching the admin-web frontend's own existing
// convention: "true"/"false" for BOOLEAN, a plain numeric string for NUMBER, "-1" as the Unlimited
// sentinel (mirrors plan_entitlement.is_unlimited, translated to a string here purely so the wire
// shape matches what the frontend already expects cell-for-cell).
service PlanAdminService {
  rpc GetPlanMatrix (google.protobuf.Empty) returns (PlanMatrixResponse);
  rpc UpdatePlanEntitlements (UpdatePlanEntitlementsRequest) returns (PlanMatrixResponse);
  rpc CreateEntitlementKey (CreateEntitlementKeyRequest) returns (PlanMatrixResponse);
}

message EntitlementKeyDefinition {
  string key = 1;
  string description = 2;
  string value_type = 3;          // BOOLEAN | NUMBER
  bool unlimited_supported = 4;
  string owner_service = 5;
}

message EntitlementMatrixRow {
  string key = 1;
  map<string, string> value_by_plan_code = 2; // "FREE"/"PRO"/"BUSINESS" -> cell value string
}

message PlanMatrixResponse {
  repeated EntitlementKeyDefinition keys = 1;
  repeated EntitlementMatrixRow rows = 2;
}

message PlanEntitlementEdit {
  string key = 1;
  string plan_code = 2;
  string value = 3;
}

message UpdatePlanEntitlementsRequest {
  repeated PlanEntitlementEdit edits = 1;
  string reason = 2;
}

message CreateEntitlementKeyRequest {
  string key = 1;
  string description = 2;
  string value_type = 3;          // BOOLEAN | NUMBER
  bool unlimited_supported = 4;
  string default_value = 5;       // "-1" allowed when unlimited_supported
  string owner_service = 6;
  string reason = 7;
}

// SubscriptionAdminService: the admin panel's read-only Subscriptions screen (list + detail core
// fields only — no writes yet; ChangePlan/CancelSubscription/entitlement-override RPCs stay
// customer-facing-only for now). Callers are platform staff (a StaffPrincipal, resolved from the
// isolated sophie-staff realm's JWT — see sophie-common-security's dual-verifier support and
// org-service's StaffJwtVerifierConfig for the pattern subscription-service now mirrors) — every
// RPC here rejects anyone who isn't a ServicePrincipal or StaffPrincipal explicitly in the handler,
// the same shape as org-service's own ListOrganizations/GetOrganizationForStaff, since a USER-tier
// PrincipalTierPolicy entry alone can't distinguish "staff" from "an ordinary customer."
//
// Deliberately does NOT re-verify the caller against a live platform_staff row the way org-service's
// own staff RPCs do (that table lives in org-service's DB, not this service's) — a deactivated staff
// member's still-unexpired JWT could read subscription data until it naturally expires. Read-only,
// low-severity, and a known, accepted gap for this pass; tracked, not silently glossed over.
service SubscriptionAdminService {
  rpc ListSubscriptions (ListSubscriptionsRequest) returns (ListSubscriptionsResponse);
  rpc GetSubscriptionForStaff (GetSubscriptionForStaffRequest) returns (Subscription);
}

message ListSubscriptionsRequest {
  .org.sophie.common.PageRequest page = 1;
}

message ListSubscriptionsResponse {
  repeated Subscription subscriptions = 1;
  .org.sophie.common.PageResponse page = 2;
}

message GetSubscriptionForStaffRequest {
  string org_id = 1;
}

// PricingAdminService: the admin panel's Pricing screen — current prices (real PlanPrice rows,
// enriched with the org-count/MRR-per-price aggregate no other RPC computes), scheduled price
// changes (backed by price_change_notice, unmapped since V1 until now), and the mandatory preview
// step the design doc's own open decision 7 calls out by name: "it cannot be assembled client-side
// from the list endpoints" — PreviewPriceChange is a real server-side aggregation (group live
// subscriptions by the price row they're pinned to, project MRR, split by renewal-date-vs-effective-
// date), not a passthrough.
//
// Reads (ListPlanPrices/ListScheduledPriceChanges/PreviewPriceChange) follow the established staff-
// tier read pattern: any ServicePrincipal or StaffPrincipal, no live platform_staff re-check (same
// accepted gap as every other read-only admin surface this effort has built).
//
// SchedulePriceChange/CancelScheduledPriceChange are writes with real platform-wide consequence, so
// they hold PlanAdminService's own stricter bar: StaffPrincipal ONLY, live-re-verified as an ACTIVE
// PLATFORM_ADMIN against org-service's platform_staff table (see PlanAdminService's own doc for the
// exact mechanism — reused unchanged here). Both also append a real admin_audit_log row.
//
// SchedulePriceChange deliberately does NOT touch the live, currently-serving PlanPrice row for the
// plan/period being changed — doing so immediately would make TODAY's real customers pay the new
// price before effective_at ever arrives (PlanChangeCalculator's own live-price lookup only checks
// valid_to IS NULL, never valid_from), which this service must never risk. It inserts price_change_
// notice (the record of INTENT) plus a new, deliberately-never-"current" PlanPrice row — created only
// because price_change_notice.new_plan_price_id is NOT NULL and needs something real to point at —
// with both valid_from and valid_to set to the same future effective_at instant, so
// ux_plan_price_current's partial unique index never sees it as open-ended and it can never be
// resolved by any live lookup. Actually flipping the live price over at effective_at (closing today's
// row, re-opening this one) is a background job this pass does not build — same "translate the mock's
// own actual behavior faithfully, don't invent new behavior it never had" reasoning: the mock's own
// schedulePriceChange never touched a PlanPrice-equivalent either, only pushed a ScheduledPriceChange
// row. Building that apply-at-effective-date job is future work, not a gap silently introduced here.
service PricingAdminService {
  rpc ListPlanPrices (google.protobuf.Empty) returns (ListPlanPricesResponse);
  rpc ListScheduledPriceChanges (google.protobuf.Empty) returns (ListScheduledPriceChangesResponse);
  rpc PreviewPriceChange (PreviewPriceChangeRequest) returns (PricePreview);
  rpc SchedulePriceChange (SchedulePriceChangeRequest) returns (ScheduledPriceChange);
  rpc CancelScheduledPriceChange (CancelScheduledPriceChangeRequest) returns (google.protobuf.Empty);
}

message ListPlanPricesResponse {
  repeated PlanPrice prices = 1;
}

message ScheduledPriceChange {
  string id = 1;
  string plan_code = 2;
  string billing_period = 3;
  string old_amount = 4;
  string new_amount = 5;
  string currency = 6;
  string direction = 7;              // INCREASE | DECREASE
  google.protobuf.Timestamp effective_at = 8;
  int32 notice_days = 9;
  int32 affected_org_count = 10;
  string status = 11;                // SCHEDULED | NOTIFIED | APPLIED | CANCELED
  optional google.protobuf.Timestamp announced_at = 12;
  optional google.protobuf.Timestamp applied_at = 13;
  optional string created_by_user_id = 14;
}

message ListScheduledPriceChangesResponse {
  repeated ScheduledPriceChange changes = 1;
}

message PreviewPriceChangeRequest {
  string plan_code = 1;
  string billing_period = 2;
  string new_amount = 3;
  google.protobuf.Timestamp effective_at = 4;
}

message PricePreview {
  string plan_code = 1;
  string billing_period = 2;
  string old_amount = 3;
  string new_amount = 4;
  string currency = 5;
  string direction = 6;               // INCREASE | DECREASE
  int32 affected_org_count = 7;
  int32 affected_seat_count = 8;
  string mrr_before = 9;
  string mrr_after = 10;
  int32 orgs_renewing_before_count = 11; // current_period_end < effective_at
  int32 orgs_renewing_after_count = 12;
  // The specific orgs counted in orgs_renewing_before_count — no org NAME here (subscription-service
  // has none of its own to give; the admin-web frontend joins real org identity onto org_id client-
  // side, the same established pattern Subscriptions/Invoices already use).
  repeated PricePreviewOrgRow renewing_before = 13;
}

message PricePreviewOrgRow {
  string org_id = 1;
  int32 seats = 2;
  string current_mrr = 3;
  string new_mrr = 4;
  google.protobuf.Timestamp renews_at = 5;
}

message SchedulePriceChangeRequest {
  string plan_code = 1;
  string billing_period = 2;
  string new_amount = 3;
  google.protobuf.Timestamp effective_at = 4;
  int32 notice_days = 5;
  string reason = 6;
}

message CancelScheduledPriceChangeRequest {
  string id = 1;
  string reason = 2;
}

service PlatformMetricsService {
  rpc GetSubscriptionMetrics (google.protobuf.Empty) returns (google.protobuf.Empty);
}
