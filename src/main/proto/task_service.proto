}

message ListProjectFieldsRequest { string project_id = 1; }
message ListProjectFieldsResponse { repeated ProjectField fields = 1; }

message SetTaskFieldValuesRequest {
  string task_id = 1;
  repeated FieldValue values = 2;
}
