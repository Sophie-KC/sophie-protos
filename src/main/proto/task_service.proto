  string name = 3;
  optional string goal = 4;
  string state = 5;                              // FUTURE | ACTIVE | COMPLETE
  optional string start_date = 6;                // ISO yyyy-MM-dd
  optional string end_date = 7;                  // ISO yyyy-MM-dd
  optional google.protobuf.Timestamp started_at = 8;
  optional google.protobuf.Timestamp completed_at = 9;
  google.protobuf.Timestamp created_at = 10;
}

