syntax = "proto3";

package com.platform.task.v1;

option java_multiple_files = true;
option java_package = "org.sophie.taskservice.grpc";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";
import "common/pagination.proto";

// Task Service: projects, an org-wide task-type catalog, and per-project workflow (statuses +
// transitions). gRPC-only, internal (called behind the Gateway, which forwards the acting user's
// internal id as `requested_by`). Project access is resolved against Org Service's role_assignments at
// scope_type=PROJECT — Task Service never owns its own access model. Boards, labels, and tasks are
// follow-up steps (their tables are not created yet).
service TaskService {
  // ── Projects ──
  // Creates the project, grants the creator PROJECT access (AssignScopeRole → "Project Admin"), and
  // seeds a default workflow (To Do / In Progress / Done, permissive transitions).
  rpc CreateProject(CreateProjectRequest) returns (Project);
  rpc GetProject(GetProjectRequest) returns (Project);                       // requires project access
  rpc ListMyProjects(ListMyProjectsRequest) returns (ListMyProjectsResponse); // accessible projects in an org
  rpc DeleteProject(DeleteProjectRequest) returns (google.protobuf.Empty);   // soft-delete; creator or project admin
  rpc UpdateProject(UpdateProjectRequest) returns (Project);                 // rename; creator or project admin

  // ── Task Types (org-wide catalog) ──
  rpc CreateTaskType(CreateTaskTypeRequest) returns (TaskType);              // org admin only
  rpc ListTaskTypes(ListTaskTypesRequest) returns (ListTaskTypesResponse);   // any org member
  rpc UpdateTaskType(UpdateTaskTypeRequest) returns (TaskType);              // org admin only
  rpc DeleteTaskType(DeleteTaskTypeRequest) returns (google.protobuf.Empty); // org admin only

  // ── Workflow (per-project) ──
  rpc CreateWorkflowStatus(CreateWorkflowStatusRequest) returns (WorkflowStatus);          // project admin
  rpc ListWorkflowStatuses(ListWorkflowStatusesRequest) returns (ListWorkflowStatusesResponse); // project member
  rpc UpdateWorkflowStatus(UpdateWorkflowStatusRequest) returns (WorkflowStatus);          // project admin
  rpc DeleteWorkflowStatus(DeleteWorkflowStatusRequest) returns (google.protobuf.Empty);   // project admin
  rpc ReorderWorkflowStatuses(ReorderWorkflowStatusesRequest) returns (ListWorkflowStatusesResponse); // project admin
  rpc CreateWorkflowTransition(CreateWorkflowTransitionRequest) returns (WorkflowTransition);   // project admin
  rpc ListWorkflowTransitions(ListWorkflowTransitionsRequest) returns (ListWorkflowTransitionsResponse); // project member
  rpc DeleteWorkflowTransition(DeleteWorkflowTransitionRequest) returns (google.protobuf.Empty); // project admin

  // ── Boards (any project member) ──
  rpc CreateBoard(CreateBoardRequest) returns (Board);
  rpc ListBoards(ListBoardsRequest) returns (ListBoardsResponse);
  rpc UpdateBoard(UpdateBoardRequest) returns (Board);
  rpc DeleteBoard(DeleteBoardRequest) returns (google.protobuf.Empty);

  // ── Labels (any project member) ──
  rpc CreateLabel(CreateLabelRequest) returns (Label);
  rpc ListLabels(ListLabelsRequest) returns (ListLabelsResponse);
  rpc UpdateLabel(UpdateLabelRequest) returns (Label);
  rpc DeleteLabel(DeleteLabelRequest) returns (google.protobuf.Empty);

  // ── Tasks ──
  rpc CreateTask(CreateTaskRequest) returns (Task);
  rpc GetTask(GetTaskRequest) returns (Task);
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);        // one query for board + list
  rpc BatchGetTaskSummaries(BatchGetTaskSummariesRequest) returns (BatchGetTaskSummariesResponse); // cross-link enrichment
  rpc GetTaskByReference(GetTaskByReferenceRequest) returns (TaskSummary);                          // resolve KEY-NUMBER → task
  // REMOVED in 0.66.0: ResolveTaskReferenceInternal. Its only consumer, VCS webhook ingestion, moved
  // INTO this service, so the reference resolver is now a plain in-process call
  // (VcsReferenceUpsertService -> TaskService.resolveTaskReferenceInternal) and the RPC had no remote
  // caller left — an unauthenticated-by-design entry point serving nobody. Do not reuse the name.

  // ── VCS references (commits/branches/PRs/MRs linked to a task) ──
  // Caller (the Gateway) is trusted to have already validated the user's access to the task itself —
  // same delegation pattern GetTask's own callers use.
  rpc ListVcsReferencesForTask(ListVcsReferencesForTaskRequest) returns (ListVcsReferencesForTaskResponse);
  // Trusted-internal, called by integration-service after it verifies a GitHub/GitLab webhook's
  // signature — this service does the actual event parsing (commit-message task-reference regex,
  // PR/MR title+body) and upserts the resulting VcsReference rows. No user in context to check access
  // for, same trust tier as ResolveTaskReferenceInternal above.
  rpc ProcessVcsWebhookEvent(ProcessVcsWebhookEventRequest) returns (google.protobuf.Empty);
  // Trusted-internal, called by integration-service's DisconnectIntegration flow — mirrors the
  // app-level FK-integrity convention this platform already uses for every cross-service id (explicit
  // cleanup call, not a real FK, since the two tables now live in different databases).
  rpc DeleteVcsReferencesForConnection(DeleteVcsReferencesForConnectionRequest) returns (google.protobuf.Empty);
  rpc UpdateTask(UpdateTaskRequest) returns (Task);
  rpc ChangeTaskStatus(ChangeTaskStatusRequest) returns (Task);       // transition- + completion-validated
  rpc SetTaskParent(SetTaskParentRequest) returns (Task);             // one-level cap; null clears

  // ── Task comments (one-level replies; author-only edit/delete; tombstone-on-delete) ──
  rpc CreateTaskComment(CreateTaskCommentRequest) returns (TaskComment);
  rpc EditTaskComment(EditTaskCommentRequest) returns (TaskComment);
  rpc DeleteTaskComment(DeleteTaskCommentRequest) returns (google.protobuf.Empty);
  rpc ListTaskComments(ListTaskCommentsRequest) returns (ListTaskCommentsResponse);
  rpc ListTaskActivity(ListTaskActivityRequest) returns (ListTaskActivityResponse); // field/status change feed (History tab)
  rpc SetTaskEpic(SetTaskEpicRequest) returns (Task);                 // group under an epic; null clears
  rpc RankTask(RankTaskRequest) returns (Task);                       // manual backlog reorder

  // ── Scrum sprints ──
  rpc CreateSprint(CreateSprintRequest) returns (Sprint);
  rpc UpdateSprint(UpdateSprintRequest) returns (Sprint);
  rpc ListSprints(ListSprintsRequest) returns (ListSprintsResponse);
  rpc StartSprint(StartSprintRequest) returns (Sprint);               // FUTURE → ACTIVE (one active/project)
  rpc CompleteSprint(CompleteSprintRequest) returns (Sprint);         // ACTIVE → COMPLETE; carries survivors
  rpc ReopenSprint(ReopenSprintRequest) returns (Sprint);            // COMPLETE → ACTIVE; no task moves
  rpc DeleteSprint(DeleteSprintRequest) returns (google.protobuf.Empty); // FUTURE only; tasks → backlog
  rpc MoveTaskToSprint(MoveTaskToSprintRequest) returns (Task);       // (re)assign one task; absent = backlog
  rpc DeleteTask(DeleteTaskRequest) returns (google.protobuf.Empty);  // soft-delete + cascade; reporter/admin
  rpc AddTaskLabel(AddTaskLabelRequest) returns (google.protobuf.Empty);
  rpc RemoveTaskLabel(RemoveTaskLabelRequest) returns (google.protobuf.Empty);
  rpc BlockTask(BlockTaskRequest) returns (google.protobuf.Empty);
  rpc UnblockTask(UnblockTaskRequest) returns (google.protobuf.Empty);

  // ── Task ↔ Doc linking (delegates to Doc Service; validates task-side access first) ──
  // ── Unified search support (unified-search-design.md §5.2) ──
  // Every project id the caller can reach, for search's ACL PRE-filter. Ids only. Reuses
  // ProjectGuard/ListMyProjects' existing access logic (a PROJECT-scope role assignment in Org
  // Service) — search never writes its own access rules. Caller = the verified principal.
  rpc ListAccessibleProjectIds(ListAccessibleProjectIdsRequest) returns (ListAccessibleProjectIdsResponse);

  // Batched post-verification for search, mirroring Doc Service's FilterAccessiblePages: given
  // candidate task ids, return the subset the caller can see. Tasks have no per-task restriction
  // layer, so this is project access for each task's project, via ProjectGuard.hasAccess.
  rpc FilterAccessibleTasks(FilterAccessibleTasksRequest) returns (FilterAccessibleTasksResponse);

  // Backfill: write search-outbox upsert rows for existing projects and tasks in batches (D8).
  rpc RequestReindex(RequestReindexRequest) returns (RequestReindexResponse);

  rpc LinkDoc(LinkDocRequest) returns (google.protobuf.Empty);
  rpc UnlinkDoc(UnlinkDocRequest) returns (google.protobuf.Empty);
  rpc ListLinkedDocs(ListLinkedDocsRequest) returns (ListLinkedDocsResponse);

  // ── Task-level attachment shelf (mirrors Doc Service's page_attachment shelf) — files uploaded to
  // a task, whether or not embedded inline in the description's rich-text body. Description-embedded
  // files are tracked separately via a TASK_DESCRIPTION file-reference owner, reconciled on save the
  // same way Doc Service's ContentDocumentProcessor walk works (no version/draft split — a task
  // description is a live column, not a published-version model). ──
  rpc AttachFileToTask(AttachFileToTaskRequest) returns (TaskAttachment);
  rpc ListTaskAttachments(ListTaskAttachmentsRequest) returns (ListTaskAttachmentsResponse);
  rpc RemoveTaskAttachment(RemoveTaskAttachmentRequest) returns (google.protobuf.Empty);
  // Task-scoped download URL for a description-embedded file — mirrors Doc Service's
  // GetAttachmentDownloadUrl: verifies project access, then requires file_id resolve via either the
  // shelf or the description's own materialized references, before minting a presigned GET.
  rpc GetTaskAttachmentDownloadUrl(GetTaskAttachmentDownloadUrlRequest) returns (GetTaskAttachmentDownloadUrlResponse);
  // Paste-driven internal re-reference (Flow B): links a file the caller already has read access to —
  // via source_kind/source_id, verified against that source's own service (PAGE → Doc Service,
  // MESSAGE → Chat Service, TASK → this same check against a different task) — onto target_task_id's
  // shelf, without re-uploading. A bare file_id proves nothing on its own.
  rpc ReferenceExistingFileForTask(ReferenceExistingFileForTaskRequest) returns (TaskAttachment);

  // Requires project.manage. Caller identity comes from the gRPC principal, never the body.
  rpc SetProjectAvatar(SetProjectAvatarRequest) returns (Project);
  rpc RemoveProjectAvatar(RemoveProjectAvatarRequest) returns (Project);

  // ── Custom fields (custom-fields-design.md) ───────────────────────────────────────────────
  // Definitions are an ORG catalog (org admin), attached per project (project manage), with values set
  // by anyone who can edit the task. Create/Restore/Attach are plan-gated; value writes and every read
  // never are, so a downgraded org keeps full use of the fields it already has (design D7).
  rpc CreateCustomField(CreateCustomFieldRequest) returns (CustomField);
  rpc UpdateCustomField(UpdateCustomFieldRequest) returns (CustomField);
  // Soft delete: hides the field everywhere, keeps every value. Reversible until PurgeCustomField.
  rpc DeleteCustomField(DeleteCustomFieldRequest) returns (google.protobuf.Empty);
  // Optional name lets the caller resolve a collision with a live field (design D3a).
  rpc RestoreCustomField(RestoreCustomFieldRequest) returns (CustomField);
  // Irreversible. Cascades to options, attachments and every stored value.
  rpc PurgeCustomField(PurgeCustomFieldRequest) returns (google.protobuf.Empty);
  rpc ListCustomFields(ListCustomFieldsRequest) returns (ListCustomFieldsResponse);

  rpc CreateFieldOption(CreateFieldOptionRequest) returns (FieldOption);
  rpc UpdateFieldOption(UpdateFieldOptionRequest) returns (FieldOption);
  // Removes the option from every task by DB cascade, for both DROPDOWN and LABELS.
  rpc DeleteFieldOption(DeleteFieldOptionRequest) returns (google.protobuf.Empty);
  rpc ReorderFieldOptions(ReorderFieldOptionsRequest) returns (ListFieldOptionsResponse);

  rpc AttachFieldToProject(AttachFieldToProjectRequest) returns (ProjectField);
  rpc DetachFieldFromProject(DetachFieldFromProjectRequest) returns (google.protobuf.Empty);
  rpc UpdateProjectField(UpdateProjectFieldRequest) returns (ProjectField);
  rpc ListProjectFields(ListProjectFieldsRequest) returns (ListProjectFieldsResponse);

  // Several fields in one transaction. A FieldValue with no value set CLEARS that field.
  rpc SetTaskFieldValues(SetTaskFieldValuesRequest) returns (Task);

  // ── Staff-tier (admin panel) ──────────────────────────────────────────────────────────────
  // Any active staff member or trusted internal service may call this — no live platform_staff
  // re-check, same accepted read-only trust level as every other staff-tier READ this admin-panel
  // effort has built. "Open" = workflow_statuses.is_completion_status = false, joined through
  // tasks -> workflow_statuses and tasks -> projects (Task has no org_id of its own; Project does).
  rpc GetOpenTaskCountForStaff(GetOpenTaskCountForStaffRequest) returns (GetOpenTaskCountForStaffResponse);
}

// ===================== Messages =====================

message Project {
  string id = 1;
  string org_id = 2;
  string key = 3;
  string name = 4;
  string description = 5;
  string created_by = 6;
  google.protobuf.Timestamp created_at = 7;
  // Server-derived: creator, project admin, or a "project.manage" permission holder. Lets the
  // frontend show/hide management controls without guessing — see ProjectGuard.canManage.
  bool can_manage = 8;
  string avatar_version = 9; // empty = no avatar set; frontend renders the monogram
}

message TaskType {
  string id = 1;
  string org_id = 2;
  string name = 3;
  // An icon ID from the client's closed set (e.g. "diamond-outline"), NOT a glyph character. Storing
  // the id lets the icon be redrawn as an SVG without a data migration, and keeps the value renderable
  // in a client that has no font for whatever character an org picked. Absent = none.
  optional string icon = 4;
  google.protobuf.Timestamp created_at = 5;
  // A colour ramp KEY (e.g. "blue"), not a hex. The key maps to a different hex in light and dark
  // themes, which a stored "#34618e" could never do. Absent = none.
  optional string color = 6;
  // Live tasks carrying this type. Populated on list only, from one grouped query — it is what lets a
  // client state the cost of a delete before attempting one the server would refuse.
  int32 usage_count = 7;
}

message WorkflowStatus {
  string id = 1;
  string project_id = 2;
  string name = 3;
  int32 order_index = 4;
  bool is_completion_status = 5;
  google.protobuf.Timestamp created_at = 6;
}

message WorkflowTransition {
  string id = 1;
  string project_id = 2;
  string from_status_id = 3;
  string to_status_id = 4;
}

// ── Projects ──

message CreateProjectRequest {
  reserved 1; // was: requested_by (phase-2 identity field, deleted)
  reserved "requested_by";
  string org_id = 2;
  string key = 3;          // unique per org
  string name = 4;
  string description = 5;  // optional
}

message GetProjectRequest {
  reserved 1; // was: requested_by (phase-2 identity field, deleted)
  reserved "requested_by";
  string project_id = 2;
}

message ListMyProjectsRequest {
  reserved 1; // was: requested_by (phase-2 identity field, deleted)
  reserved "requested_by";
  string org_id = 2;
}

message ListMyProjectsResponse {
  repeated Project projects = 1;
}

message DeleteProjectRequest {
  reserved 1; // was: requested_by (phase-2 identity field, deleted)
  reserved "requested_by";
  string project_id = 2;
}

message UpdateProjectRequest {
  reserved 1; // was: requested_by (phase-2 identity field, deleted)
  reserved "requested_by";
  string project_id = 2;
  optional string name = 3; // partial: absent = unchanged
}

// ── Task Types ──

message CreateTaskTypeRequest {
  reserved 1; // was: requested_by (phase-2 identity field, deleted)
  reserved "requested_by";
  string org_id = 2;
  string name = 3;
  string icon = 4;  // optional, an icon id
  string color = 5; // optional, a ramp key
}

message ListTaskTypesRequest {
  reserved 1; // was: requested_by (phase-2 identity field, deleted)
  reserved "requested_by";
  string org_id = 2;
}

message ListTaskTypesResponse {
  repeated TaskType task_types = 1;
}

message UpdateTaskTypeRequest {
  reserved 1; // was: requested_by (phase-2 identity field, deleted)
  reserved "requested_by";
  string task_type_id = 2;
  optional string name = 3;  // partial: absent = unchanged
  optional string icon = 4;  // partial: present-empty clears
  optional string color = 5; // partial: present-empty clears
}

message DeleteTaskTypeRequest {
  reserved 1; // was: requested_by (phase-2 identity field, deleted)
  reserved "requested_by";
  string task_type_id = 2;
}

// ── Workflow ──

message CreateWorkflowStatusRequest {
  reserved 1; // was: requested_by (phase-2 identity field, deleted)
  reserved "requested_by";
  string project_id = 2;
  string name = 3;
  int32 order_index = 4;
  bool is_completion_status = 5;
}

message ListWorkflowStatusesRequest {
  reserved 1; // was: requested_by (phase-2 identity field, deleted)
  reserved "requested_by";
  string project_id = 2;
}

message ListWorkflowStatusesResponse {
  repeated WorkflowStatus statuses = 1;
}

message UpdateWorkflowStatusRequest {
  reserved 1; // was: requested_by (phase-2 identity field, deleted)
  reserved "requested_by";
  string status_id = 2;
  optional string name = 3;
  optional int32 order_index = 4;
  optional bool is_completion_status = 5;
}

message DeleteWorkflowStatusRequest {
  reserved 1; // was: requested_by (phase-2 identity field, deleted)
  reserved "requested_by";
  string status_id = 2;
}

message ReorderWorkflowStatusesRequest {
  reserved 1; // was: requested_by (phase-2 identity field, deleted)
  reserved "requested_by";
  string project_id = 2;
  // The full set of the project's status ids, in the desired board order.
  repeated string status_ids = 3;
}

message CreateWorkflowTransitionRequest {
  reserved 1; // was: requested_by (phase-2 identity field, deleted)
  reserved "requested_by";
  string project_id = 2;
  string from_status_id = 3;
  string to_status_id = 4;
}

message ListWorkflowTransitionsRequest {
  reserved 1; // was: requested_by (phase-2 identity field, deleted)
  reserved "requested_by";
  string project_id = 2;
}

message ListWorkflowTransitionsResponse {
  repeated WorkflowTransition transitions = 1;
}

message DeleteWorkflowTransitionRequest {
  reserved 1; // was: requested_by (phase-2 identity field, deleted)
  reserved "requested_by";
  string transition_id = 2;
}

// ===================== Boards =====================

message Board {
  string id = 1;
  string project_id = 2;
  string name = 3;
  string default_filter = 4; // opaque JSON string
  google.protobuf.Timestamp created_at = 5;
  bool is_default = 6;        // the board a project opens on (one per project)
}

message CreateBoardRequest {
  reserved 1; // was: requested_by (phase-2 identity field, deleted)
  reserved "requested_by";
  string project_id = 2;
  string name = 3;
  string default_filter = 4; // optional; defaults to "{}"
}

message ListBoardsRequest {
  reserved 1; // was: requested_by (phase-2 identity field, deleted)
  reserved "requested_by";
  string project_id = 2;
}

message ListBoardsResponse {
  repeated Board boards = 1;
}

message UpdateBoardRequest {
  reserved 1; // was: requested_by (phase-2 identity field, deleted)
  reserved "requested_by";
  string board_id = 2;
  optional string name = 3;
  optional string default_filter = 4;
  optional bool make_default = 5; // true = make this the project's default board (unsets any other)
}

message DeleteBoardRequest {
  reserved 1; // was: requested_by (phase-2 identity field, deleted)
  reserved "requested_by";
  string board_id = 2;
}

// ===================== Labels =====================

message Label {
  string id = 1;
  string project_id = 2;
  string name = 3;
  optional string color = 4;
}

message CreateLabelRequest {
  reserved 1; // was: requested_by (phase-2 identity field, deleted)
  reserved "requested_by";
  string project_id = 2;
  string name = 3;
  string color = 4; // optional
}

message ListLabelsRequest {
  reserved 1; // was: requested_by (phase-2 identity field, deleted)
  reserved "requested_by";
  string project_id = 2;
}

message ListLabelsResponse {
  repeated Label labels = 1;
}

message UpdateLabelRequest {
  reserved 1; // was: requested_by (phase-2 identity field, deleted)
  reserved "requested_by";
  string label_id = 2;
  optional string name = 3;
  optional string color = 4;
}

message DeleteLabelRequest {
  reserved 1; // was: requested_by (phase-2 identity field, deleted)
  reserved "requested_by";
  string label_id = 2;
}

// ===================== Tasks =====================

message Task {
  string id = 1;
  string project_id = 2;
  int32 task_number = 3;
  string task_type_id = 4;
  optional string parent_task_id = 5;
  string status_id = 6;
  string title = 7;
  optional string description = 8;
  optional string assignee_id = 9;
  string reporter_id = 10;
  repeated string label_ids = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
  repeated TaskSummary blocks = 14;      // tasks THIS task blocks
  repeated TaskSummary blocked_by = 15;  // tasks blocking THIS task
  string priority = 16;                  // HIGHEST | HIGH | MEDIUM | LOW | LOWEST
  optional int32 story_points = 17;      // estimate; absent = unestimated
  optional string due_date = 18;         // ISO yyyy-MM-dd; absent = none
  int64 rank = 19;                       // manual backlog order within the project (ascending)
  optional string sprint_id = 20;        // sprint this task belongs to; absent = backlog
  optional string epic_id = 21;          // epic (a task of the Epic type) this groups under; absent = none
  // Custom-field values, only for fields that are live AND attached to this task's project. Batch-loaded
  // per page by ListTasks — one query per value table, never one per task.
  repeated FieldValue field_values = 22;
}

// Lightweight reference for dependency lists — enough to render a link, never full task detail.
message TaskSummary {
  string id = 1;
  int32 task_number = 2;
  string title = 3;
  string status_id = 4;
}

message CreateTaskRequest {
  reserved 1; // was: requested_by (phase-2 identity field, deleted)
  reserved "requested_by";
  string project_id = 2;
  string task_type_id = 3;
  string title = 4;
  optional string description = 5;
  optional string assignee_id = 6;
  optional string parent_task_id = 7;
  optional string reporter_id = 8; // defaults to the caller
  repeated string label_ids = 9;
  optional string priority = 10;     // defaults MEDIUM
  optional int32 story_points = 11;
  optional string due_date = 12;     // ISO yyyy-MM-dd
  optional string epic_id = 13;      // group under this epic
  // Create straight into a sprint. Absent = the backlog, which is what every caller got before this
  // field existed — so a task created from the board of an ACTIVE sprint landed in the backlog instead
  // of the sprint the user was looking at. The client says which sprint it means rather than the server
  // guessing, because the backlog view creates tasks too and must keep creating them unassigned.
  optional string sprint_id = 14;
}

message GetTaskRequest {
  reserved 1; // was: requested_by (phase-2 identity field, deleted)
  reserved "requested_by";
  string task_id = 2;
}

// Lightweight batch lookup for cross-link enrichment (Docs' linked tasks, richtext smart links). Mirrors
// Org Service's BatchGetUsers: returns a summary for each id that exists (missing/deleted ids are simply
// omitted), no per-task access filtering beyond being a normal authenticated caller.
message BatchGetTaskSummariesRequest {
  reserved 1; // was: requested_by (phase-2 identity field, deleted)
  reserved "requested_by";
  repeated string task_ids = 2;
}

message BatchGetTaskSummariesResponse {
  repeated TaskSummaryDetail summaries = 1;
}

// Resolve a human task reference (projectKey-taskNumber) to a task. projectKey is unique only per org, so
// the lookup is scoped to the projects the caller can access.
message GetTaskByReferenceRequest {
  reserved 1; // was: requested_by (phase-2 identity field, deleted)
  reserved "requested_by";
  string project_key = 2;
  int32 task_number = 3;
}

// RESERVED in 0.66.0 — was ResolveTaskReferenceInternalRequest, for the RPC of the same name (see the
// service block). Kept as a tombstone so the name is never silently reused for a different shape.
message ResolveTaskReferenceInternalRequest {
  reserved 1, 2, 3;
  reserved "org_id", "project_key", "task_number";
}

message VcsReference {
  string id = 1;
  string vcs_connection_id = 2;
  string task_id = 3;
  string reference_type = 4;   // COMMIT, BRANCH, PULL_REQUEST, MERGE_REQUEST
  string external_id = 5;      // commit SHA / PR-MR number / branch name
  optional string title = 6;
  string url = 7;
  optional string state = 8;   // open/merged/closed; absent for commits
  optional string author_external = 9;
  google.protobuf.Timestamp occurred_at = 10;
  google.protobuf.Timestamp created_at = 11;
}

message ListVcsReferencesForTaskRequest {
  string task_id = 1;
  // Keyset on (occurred_at desc, id desc) — newest first. One row per commit, so this grows without
  // bound on an active task.
  .org.sophie.common.PageRequest page = 2;
}

message ListVcsReferencesForTaskResponse {
  repeated VcsReference references = 1;
  .org.sophie.common.PageResponse page = 2;
}

message ProcessVcsWebhookEventRequest {
  string vcs_connection_id = 1;
  string org_id = 2;
  string provider = 3;       // GITHUB, GITLAB
  string event_type = 4;     // push, pull_request, etc (GitHub) / equivalent GitLab event
  bytes raw_body = 5;
}

message DeleteVcsReferencesForConnectionRequest {
  string vcs_connection_id = 1;
}

// Enough to render a cross-link and build its full-page URL (project_key + task_number).
message TaskSummaryDetail {
  string id = 1;
  string project_key = 2;
  int32 task_number = 3;
  string title = 4;
  string status_id = 5;
  string status_name = 6;
}

// How ListTasks orders and keysets. Unspecified = NUMBER, so a 0.65.0 client is unchanged.
enum TaskSort {
  TASK_SORT_UNSPECIFIED = 0; // server default: NUMBER
  TASK_SORT_NUMBER      = 1; // task_number asc — the stable, human-facing order
  TASK_SORT_RANK        = 2; // rank asc, id asc — manual backlog order (see RankTask)
  // Sort by a custom field's value; requires sort_field_id. Tasks with no value ALWAYS sort last,
  // in either direction. Not allowed on LABELS or PEOPLE (multi-valued has no single sort key).
  TASK_SORT_FIELD       = 3;
}

// Ascending unless stated. Applies to TASK_SORT_FIELD; NUMBER and RANK are always ascending.
enum SortDirection {
  SORT_DIRECTION_UNSPECIFIED = 0; // ASC
  SORT_ASC                   = 1;
  SORT_DESC                  = 2;
}

// How a field filter compares. Which ops are legal depends on the field's type — see
// custom-fields-design.md §4.1. An op the type does not support is INVALID_ARGUMENT.
enum FieldFilterOp {
  FIELD_FILTER_OP_UNSPECIFIED = 0;
  IS_SET       = 1;  // any type: a value exists
  IS_EMPTY     = 2;  // any type: no value
  EQUALS       = 3;  // TEXT, URL — exact
  CONTAINS     = 4;  // TEXT, URL — case-insensitive substring
  EQ           = 5;  // NUMBER, MONEY, PROGRESS
  NE           = 6;  // has a value, and it differs (a task with NO value does not match)
  LT           = 7;
  LTE          = 8;
  GT           = 9;
  GTE          = 10;
  BETWEEN      = 11; // NUMBER/MONEY/PROGRESS or DATE — inclusive, needs exactly 2 values
  ON           = 12; // DATE
  BEFORE       = 13; // DATE
  AFTER        = 14; // DATE
  ANY_OF       = 15; // DROPDOWN, LABELS, PEOPLE
  ALL_OF       = 16; // LABELS, PEOPLE — every listed id present
  NONE_OF      = 17; // DROPDOWN, LABELS, PEOPLE
  CHECKED      = 18; // CHECKBOX
  NOT_CHECKED  = 19; // CHECKBOX
}

// One custom-field condition on ListTasks. AND-combined with every other filter.
//
// Each of these becomes its own EXISTS / NOT EXISTS subquery server-side, never a join: joining a
// multi-valued field would return the same task once per matching value, corrupting both the page size
// and the keyset.
message FieldFilter {
  string field_id = 1;
  FieldFilterOp op = 2;
  // Operands, as strings in the field's own format: a decimal for NUMBER/MONEY/PROGRESS, ISO yyyy-MM-dd
  // for DATE, a uuid for option/user ids. Empty for IS_SET/IS_EMPTY/CHECKED/NOT_CHECKED, exactly 2 for
  // BETWEEN, one or more for ANY_OF/ALL_OF/NONE_OF.
  //
  // A PEOPLE filter accepts the literal "me", resolved server-side to the authenticated caller.
  repeated string values = 3;
}

message ListTasksRequest {
  reserved 1; // was: requested_by (phase-2 identity field, deleted)
  reserved "requested_by";
  string project_id = 2;
  // Filters (all optional) — the same set serves board and list views.
  repeated string label_ids = 3;
  optional string assignee_id = 4;
  optional string reporter_id = 5;
  optional string status_id = 6;
  // Keyset on task_number ASC (unique per project). Default direction FORWARD.
  .org.sophie.common.PageRequest page = 7;
  optional string parent_task_id = 8; // children of this task only
  optional string task_type_id = 9;   // tasks of this type only (e.g. the "Epic" type)
  // Sprint/epic narrowing. The literal string "none" means IS NULL — i.e. sprint_id="none" is the
  // backlog, epic_id="none" is work grouped under no epic. Absent = no filter on that dimension.
  optional string sprint_id = 10;
  optional string epic_id = 11;
  // Sort + keyset dimension. A cursor is only valid for the sort it was issued under; mixing them is
  // INVALID_ARGUMENT rather than a silently wrong page.
  TaskSort sort = 12;
  // Custom-field conditions, AND-combined with the filters above and with each other. At most 5.
  repeated FieldFilter field_filters = 13;
  // Required when sort = TASK_SORT_FIELD, ignored otherwise. A cursor is bound to this id as well as to
  // the sort, so changing the field mid-paging is rejected rather than silently repaginating.
  optional string sort_field_id = 14;
  SortDirection sort_direction = 15;
}

message ListTasksResponse {
  repeated Task tasks = 1;
  .org.sophie.common.PageResponse page = 2;
}

