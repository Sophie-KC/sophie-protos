message GetSprintBurndownRequest {
  string sprint_id = 1;
  // IANA zone the days are cut in (e.g. "Asia/Tashkent"). Empty = UTC. Without it, work finished at
  // 21:00 in Tashkent would count toward the next day.
  string time_zone = 2;
}

message BurndownPoint {
  string date = 1;                 // ISO yyyy-MM-dd
  int32 remaining_points = 2;      // end-of-day remaining (scope − done)
  int32 scope_points = 3;          // end-of-day total in sprint
  int32 completed_points = 4;      // end-of-day done
}

message SprintBurndown {
  Sprint sprint = 1;
  // False when the sprint started before scope events were recorded: there is nothing to replay, so
  // the client shows an explanation instead of a flat line.
  bool has_data = 2;
  int32 committed_points = 3;      // scope at start
  repeated BurndownPoint points = 4; // one per day from start_date to min(end_date, today / completion)
  int32 unestimated_tasks = 5;     // tasks in scope without points, so a flat chart can say why
}

message ListSprintVelocityRequest {
