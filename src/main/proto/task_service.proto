  string project_id = 1;
  bool enabled = 2;
  optional string settings_json = 3;   // absent = keep; "{}" = follow the org default; else a complete document
}

message ProjectTimeSettings {
  string project_id = 1;
  bool enabled = 2;
  string settings_json = 3;            // the effective settings
  bool own_config = 4;                 // false = follows the org default
  bool can_edit = 5;
}

message GetOrgTimeDefaultsRequest {
  string org_id = 1;
}

message UpdateOrgTimeDefaultsRequest {
  string org_id = 1;
  string defaults_json = 2;            // partial settings; absent fields keep the built-in values
}

message OrgTimeDefaults {
  string org_id = 1;
  string defaults_json = 2;
  bool can_edit = 3;
}

message Worklog {
  string id = 1;
  string task_id = 2;
  string project_id = 3;
  string user_id = 4;                  // whose time it is
  string started_at = 5;               // ISO instant
  int32 minutes = 6;
  optional string description = 7;
  string source = 8;                   // MANUAL | TIMER
  string created_by = 9;               // differs from user_id when logged on someone's behalf
  string created_at = 10;
  string updated_at = 11;
}

message GetTaskTimeRequest {
  string task_id = 1;
}

message TaskTime {
  string task_id = 1;
  bool enabled = 2;                    // false = the project doesn't track time: show nothing
  string settings_json = 3;
  optional int32 original_minutes = 4;
  optional int32 remaining_minutes = 5;
  int32 spent_minutes = 6;
  repeated Worklog worklogs = 7;       // newest first
  bool can_log_for_others = 8;
  bool can_manage_worklogs = 9;
}

message LogWorkRequest {
  string task_id = 1;
  optional string user_id = 2;         // absent = the caller
  string started_at = 3;               // ISO instant
  int32 minutes = 4;                   // 1..1440
  optional string description = 5;
  string remaining_mode = 6;           // AUTO (default) | SET | LEAVE
  optional int32 remaining_minutes = 7;
}

message UpdateWorklogRequest {
  string worklog_id = 1;
  string started_at = 2;
  int32 minutes = 3;
  optional string description = 4;
}

message DeleteWorklogRequest {
  string worklog_id = 1;
}

message DeleteWorklogResponse {}

message SetTaskEstimateRequest {
  string task_id = 1;
  optional int32 original_minutes = 2;
  bool clear_original = 3;
  optional int32 remaining_minutes = 4;
  bool clear_remaining = 5;
}

message RunningTimer {
  string task_id = 1;
  string project_id = 2;
  string project_key = 3;
  int32 task_number = 4;
  string task_title = 5;
  string started_at = 6;
  bool needs_confirmation = 7;         // running over 12h: ask before logging
}

message StartTimerRequest {
  string task_id = 1;
}

message StopTimerRequest {
  optional int32 minutes = 1;          // the duration the person confirmed (long timers)
  optional string description = 2;
}

message StopTimerResponse {
  optional Worklog worklog = 1;        // absent = nothing logged (under a minute, or no timer)
}

message DiscardTimerRequest {}

message DiscardTimerResponse {}

message GetMyTimerRequest {}

message GetMyTimerResponse {
  optional RunningTimer timer = 1;
}

message GetTimesheetRequest {
  string org_id = 1;
  repeated string user_ids = 2;        // empty = the caller
  string from = 3;                     // ISO date, inclusive
  string to = 4;                       // ISO date, inclusive; at most 93 days
  string time_zone = 5;
}

message TimesheetCell {
  string user_id = 1;
  string task_id = 2;
  string task_key = 3;
  string task_title = 4;
  string project_id = 5;
  string day = 6;                      // ISO date in the requested zone
  int32 minutes = 7;
}

message Timesheet {
  repeated string people = 1;
  repeated TimesheetCell cells = 2;
  repeated string hidden_people = 3;   // asked for, but nothing of theirs is visible to the caller
}

// ── Archive ──

message SetTaskArchivedRequest {
  string task_id = 1;
  bool archived = 2; // false restores. Sub-tasks follow their parent either way.
}

message ArchiveTasksInStatusRequest {
  string status_id = 1; // "Archive all cards in this list"
}

message ArchiveTasksInStatusResponse {
  int32 archived_count = 1;
}

// ===================== Import (import-service only) =====================

// Which of the request's ids this call created, and which already existed (a resent batch).
message ImportBatchResponse {
  repeated string created_ids = 1;
  repeated string existing_ids = 2;
}

message ImportProjectRequest {
  string id = 1;                       // chosen by the caller
  string org_id = 2;
  string imported_by = 3;              // internal users.id — the project's creator and its first admin
  string key = 4;                      // same rules as CreateProject: unique per org, at most 10 characters
  string name = 5;
  string description = 6;              // optional
  // Decides the project's FEATURES only (kanban | scrum | waterfall; empty = kanban). Its statuses are
  // not seeded — the project gets exactly `statuses` below.
  string template_key = 7;
  repeated ImportStatus statuses = 8;  // at least one; board order = list order; any → any transitions
  repeated ImportLabel labels = 9;
  // Set above the source's highest issue number, so a task someone creates by hand while the import
  // is still running can never take a number an imported task needs. At least 1.
  int32 next_task_number = 10;
  google.protobuf.Timestamp created_at = 11; // absent = now
}

message ImportStatus {
  string id = 1;
  string name = 2;                     // at most 50 characters, unique within the project
  string status_group = 3;             // TODO | IN_PROGRESS | DONE
  string color = 4;                    // optional ramp key, e.g. "blue" — never a hex
}

message ImportLabel {
  string id = 1;
  string name = 2;                     // at most 50 characters, unique within the project
  string color = 3;                    // optional, same values CreateLabel accepts
}

// Org-owned task types, for source issue types that match none of the five system types.
message ImportTaskTypesRequest {
  string org_id = 1;
  string imported_by = 2;
  repeated ImportTaskType types = 3;
}

message ImportTaskType {
  string id = 1;
  string name = 2;                     // at most 50 characters, unique within the org
  string icon = 3;                     // icon id (e.g. "diamond-outline"), same as CreateTaskType
  string color = 4;                    // ramp key
}

// Creates any field not yet present (by id) — needs the tasks.custom.fields feature and room under
// tasks.custom_fields.max, exactly as CreateCustomField — adds any option not yet present, and attaches
// every listed field to project_id. A field already created for another project in the same org is
// reused and only attached here, which is how one source field shared by several projects comes across.
message ImportCustomFieldsRequest {
  string org_id = 1;
  string imported_by = 2;
  string project_id = 3;
  repeated ImportCustomField fields = 4;
}

message ImportCustomField {
  string id = 1;
  string name = 2;
  string type = 3;                     // one of the ten CustomField types
  string description = 4;              // optional
  string config_json = 5;              // as CreateCustomField; empty = {}
  repeated ImportFieldOption options = 6; // DROPDOWN / LABELS only; position = list order
}

message ImportFieldOption {
  string id = 1;
  string label = 2;
  string color = 3;                    // optional
}

// Sprints keep their real state and history timestamps. At most one ACTIVE per project, as always.
message ImportSprintsRequest {
  string org_id = 1;
  string project_id = 2;
  repeated ImportSprint sprints = 3;
}

message ImportSprint {
  string id = 1;
  string name = 2;
  string goal = 3;                     // optional
  string state = 4;                    // FUTURE | ACTIVE | COMPLETE
  string start_date = 5;               // optional ISO yyyy-MM-dd
  string end_date = 6;                 // optional ISO yyyy-MM-dd
  google.protobuf.Timestamp started_at = 7;   // ACTIVE / COMPLETE
  google.protobuf.Timestamp completed_at = 8; // COMPLETE
}

// Up to 200 tasks. An epic or parent referenced here must already exist or come EARLIER in this batch.
message ImportTasksRequest {
  string org_id = 1;
  string project_id = 2;
  string imported_by = 3;
  repeated ImportTask tasks = 4;
}

message ImportTask {
  string id = 1;
  int32 task_number = 2;               // kept as given; unique within the project
  string task_type_id = 3;
  string status_id = 4;
  string title = 5;
  optional string description = 6;    // TipTap JSON
  string priority = 7;                 // HIGHEST | HIGH | MEDIUM | LOW | LOWEST; empty = MEDIUM
  optional int32 story_points = 8;
  optional string assignee_id = 9;     // must be an org member
  string reporter_id = 10;             // must be an org member; empty = imported_by
  optional string sprint_id = 11;      // any state, including COMPLETE: this is history
  optional string epic_id = 12;
  optional string parent_task_id = 13;
  repeated string label_ids = 14;
  optional string due_date = 15;       // ISO yyyy-MM-dd
  optional string start_date = 16;     // ISO yyyy-MM-dd, never after due_date
  repeated FieldValue field_values = 17; // fields must be attached to the project
  repeated string attachment_file_ids = 18; // confirmed File Service files of this org → the task's shelf
  google.protobuf.Timestamp created_at = 19; // absent = now
  google.protobuf.Timestamp updated_at = 20; // absent = created_at
  optional google.protobuf.Timestamp archived_at = 21;
}

// "blocks" links only (the one typed link Tasks has). Same rule as BlockTask: both tasks in one project
// of org_id, never a task with itself — a cross-project source link belongs in the description instead.
// Ids in the response are "<blocking_task_id>:<blocked_task_id>".
message ImportTaskBlocksRequest {
  string org_id = 1;
  repeated ImportTaskBlock blocks = 2;
}

message ImportTaskBlock {
  string blocking_task_id = 1;
  string blocked_task_id = 2;
}

// Up to 500 comments. A reply's parent must already exist or come earlier in the batch; replies are
// one level deep, as in the app.
message ImportTaskCommentsRequest {
  string org_id = 1;
  repeated ImportTaskComment comments = 2;
}

message ImportTaskComment {
  string id = 1;
  string task_id = 2;
  optional string parent_comment_id = 3;
  string author_id = 4;                // must be an org member
  string content = 5;                  // TipTap JSON
  google.protobuf.Timestamp created_at = 6;
  optional google.protobuf.Timestamp edited_at = 7;
}

message FinishProjectImportRequest {
  string org_id = 1;
  string project_id = 2;
}


// ───────────────────────── Team boards ─────────────────────────

message StringList {
  repeated string values = 1;
}

message TeamBoardProject {
  string id = 1;
  string key = 2;
  string name = 3;
}

message TeamBoardColumn {
  string id = 1;                    // empty when creating a column
  string name = 2;
  string status_group = 3;          // TODO | IN_PROGRESS | DONE, or empty for a custom column
  repeated string status_ids = 4;   // statuses (of any included project) shown in this column
}

message TeamBoardColumns {
  repeated TeamBoardColumn columns = 1;   // in display order
}

message TeamBoard {
  string id = 1;
  string org_id = 2;
  string name = 3;
  string scope = 4;                              // JSON, as Board.scope: which tasks of the projects are on it
  // Only the included projects the caller can reach — the rest are counted, never named.
  repeated TeamBoardProject projects = 5;
  int32 hidden_project_count = 6;
  repeated TeamBoardColumn columns = 7;
  repeated string admin_ids = 8;
  bool can_manage = 9;                           // the caller is a board admin
  google.protobuf.Timestamp created_at = 10;
  optional int32 sprint_length_days = 11;   // as Board.sprint_length_days
}

message CreateTeamBoardRequest {
  string org_id = 1;
  string name = 2;
  string scope = 3;                  // optional JSON; defaults to "{}"
  repeated string project_ids = 4;   // at least one
}

message ListTeamBoardsRequest {
  string org_id = 1;
}

message ListTeamBoardsResponse {
  repeated TeamBoard boards = 1;
}

message GetTeamBoardRequest {
  string board_id = 1;
}

message UpdateTeamBoardRequest {
  string board_id = 1;
  optional string name = 2;
  optional string scope = 3;
  optional StringList project_ids = 4;     // replaces the set
  optional TeamBoardColumns columns = 5;   // replaces the columns (ids kept for those given)
  optional StringList admin_ids = 6;       // replaces the admin list; never leaves it empty
  optional int32 sprint_length_days = 7;   // 1-90; 0 = the default (14)
}

message DeleteTeamBoardRequest {
  string board_id = 1;
}

message ListTeamBoardTasksRequest {
  string board_id = 1;
}

message ListTeamBoardTasksResponse {
  repeated Task tasks = 1;
  // Tasks on the board in projects the caller can't reach: a number, never titles.
  int32 hidden_count = 2;
}

message MoveTeamBoardCardRequest {
  string board_id = 1;
  string task_id = 2;
  string column_id = 3;
}


// ───────────────────────── Initiatives ─────────────────────────

message CreateInitiativeRequest {
  string project_id = 1;            // where the initiative lives — usually a "Portfolio" project
  string title = 2;
  optional string description = 3;
  optional string locale = 4;       // names the Initiative type the first time it is made for the org
}

message SetTaskInitiativeRequest {
  string task_id = 1;               // an epic or phase
  optional string initiative_id = 2; // absent/empty = remove from its initiative
}

message GetInitiativeRollupRequest {
  string initiative_id = 1;
}

message ListInitiativesRequest {
  string org_id = 1;
}

message InitiativeEpic {
  string task_id = 1;
  string project_id = 2;
  string project_key = 3;
  int32 task_number = 4;
  string title = 5;
  string status_id = 6;
  bool done = 7;                    // the epic itself is in a DONE status
  int32 tasks_total = 8;            // live, unarchived tasks grouped under it
  int32 tasks_done = 9;
  int32 points_total = 10;
  int32 points_done = 11;
  optional string start_date = 12;
  optional string due_date = 13;
}

// Progress is the caller's own view: epics in projects they can't reach are only counted, and add nothing to the
// totals or the dates (so two people can see different numbers for one initiative, by design).
message InitiativeRollup {
  Task initiative = 1;
  string project_key = 2;           // of the initiative's own project
  repeated InitiativeEpic epics = 3;   // empty in a list
  int32 epic_count = 4;             // visible epics
  int32 epics_done = 5;
  int32 hidden_epic_count = 6;
  int32 tasks_total = 7;
  int32 tasks_done = 8;
  int32 points_total = 9;
  int32 points_done = 10;
  optional string start_date = 11;  // earliest start among visible epics
  optional string due_date = 12;    // latest due among visible epics
}

message ListInitiativesResponse {
  repeated InitiativeRollup initiatives = 1;
}

// Place a card between two others in the board's own order (ranks within a project don't compare across projects, so a
// team board keeps a separate rank per card). Either neighbour may be absent to go to an end.
message RankTeamBoardCardRequest {
  string board_id = 1;
  string task_id = 2;
  optional string previous_task_id = 3;
  optional string next_task_id = 4;
}
