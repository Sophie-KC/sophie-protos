  string sprint_id = 1;
  string name = 2;
  int32 committed_points = 3;
  int32 completed_points = 4;
  bool has_data = 5;
  optional string start_date = 6;
  optional string end_date = 7;
}

message ListSprintVelocityResponse {
  repeated SprintVelocity sprints = 1; // oldest → newest, for charting
}

// ── Dashboards (claude/dashboards-design.md §10) ──

// One metric query. Empty project_ids = every project the caller can access; a listed project the caller
// can't access is left out and only counted (hiddenProjectCount in the result).
message RunMetricRequest {
  string org_id = 1;
  string metric = 2;                 // catalogue key: throughput, cycle_time, cfd, project_health, ...
  repeated string project_ids = 3;
  repeated string people = 4;        // user ids; others than the caller need analytics.view_people
  repeated string type_ids = 5;
  repeated string label_ids = 6;
  string from = 7;                   // ISO yyyy-MM-dd, inclusive; empty = 30 days before `to`
  string to = 8;                     // ISO yyyy-MM-dd, inclusive; empty = today
  string time_zone = 9;              // IANA zone days are cut in; empty = UTC
  string bucket = 10;                // DAY | WEEK | MONTH; empty = the metric's default
  string group_by = 11;              // NONE | PROJECT | PERSON | TYPE | STATUS | PRIORITY | TEAM | COMPONENT | INITIATIVE; empty = default
  map<string, string> params = 12;   // metric-specific, e.g. unit=POINTS, last=7, boardId=<board>
  repeated string team_ids = 13;       // only tasks owned by one of these teams
  repeated string component_ids = 14;  // only tasks in one of these components
  repeated string initiative_ids = 15; // only tasks that roll up (themselves or through their epic) to one of these
}

// The tasks behind one mark of a chart. selector: bucket (a bucket's first day), group (a group key),
// series (created | completed), status (a status id), minDays / maxDays.
message DrillDownMetricRequest {
  RunMetricRequest query = 1;
  map<string, string> selector = 2;
}

// A JSON document from task-service: a metric envelope {metric, from, to, timeZone, projectIds,
// hiddenProjectCount, peopleVisible, notices[], body{kind, ...}}, a health evaluation, or the preset list.
message MetricJson {
  string json = 1;
}

