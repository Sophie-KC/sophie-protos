// ═══════════════════ Custom fields ═══════════════════
// See claude/custom-fields-design.md. `type` and `config_json` are strings rather than proto enums,
// matching Task.priority / Sprint.state and the VARCHAR(20) / JSONB columns behind them.

message CustomField {
  string id = 1;
  string org_id = 2;
  string name = 3;
  // TEXT URL NUMBER MONEY PROGRESS DATE CHECKBOX DROPDOWN LABELS PEOPLE. Never changes after creation.
  string type = 4;
  optional string description = 5;
  // JSON object. NUMBER: {"decimals":0-4}. MONEY: {"currency":"UZS"} — currency is immutable.
  string config_json = 6;
  // DROPDOWN and LABELS only, ordered by position.
  repeated FieldOption options = 7;
  // Tasks carrying a value for this field. Populated by ListCustomFields so a delete confirmation can
  // name the blast radius BEFORE deleting; zero elsewhere.
  int64 usage_count = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  // Set = soft-deleted, restorable. Only returned when include_deleted was asked for.
  optional google.protobuf.Timestamp deleted_at = 11;
}

message FieldOption {
  string id = 1;
  string field_id = 2;
  string label = 3;
  optional string color = 4;
  int32 position = 5;
  int64 usage_count = 6; // as CustomField.usage_count, per option
}

message ProjectField {
  string project_id = 1;
  string field_id = 2;
  int32 position = 3;
  bool show_on_card = 4;
  CustomField field = 5; // the definition, so a client needs one call
}

// A repeated value inside a oneof needs a wrapper message.
message OptionIdList { repeated string ids = 1; }
message UserIdList { repeated string ids = 1; }

// Used for BOTH reading (Task.field_values) and writing (SetTaskFieldValues). No value set = cleared.
message FieldValue {
  string field_id = 1;
  oneof value {
    string text = 2;            // TEXT, URL
    string number = 3;          // NUMBER, MONEY, PROGRESS — decimal as a string, never a float
    string date = 4;            // DATE, ISO yyyy-MM-dd
    bool checked = 5;           // CHECKBOX — only ever true; absent means unchecked (design D9)
    string option_id = 6;       // DROPDOWN
    OptionIdList option_ids = 7; // LABELS
    UserIdList user_ids = 8;    // PEOPLE — internal users.id, never a Keycloak sub
  }
}

message CreateCustomFieldRequest {
  string org_id = 1;
  string name = 2;
  string type = 3;
  optional string description = 4;
  string config_json = 5;
  // DROPDOWN/LABELS may seed their options in the same call; position is the list order.
  repeated FieldOptionInput options = 6;
}

message FieldOptionInput {
  string label = 1;
  optional string color = 2;
}

message UpdateCustomFieldRequest {
  string field_id = 1;
  optional string name = 2;
  optional string description = 3;
  // NUMBER decimals only. MONEY currency and the type itself are immutable.
  optional string config_json = 4;
}

message DeleteCustomFieldRequest { string field_id = 1; }
message PurgeCustomFieldRequest { string field_id = 1; }

message RestoreCustomFieldRequest {
  string field_id = 1;
  // Rename on the way back in, to resolve a collision with a live field.
  optional string name = 2;
}

message ListCustomFieldsRequest {
  string org_id = 1;
  bool include_deleted = 2;
}

message ListCustomFieldsResponse { repeated CustomField fields = 1; }
message ListFieldOptionsResponse { repeated FieldOption options = 1; }

message CreateFieldOptionRequest {
  string field_id = 1;
  string label = 2;
  optional string color = 3;
}

message UpdateFieldOptionRequest {
  string option_id = 1;
  optional string label = 2;
