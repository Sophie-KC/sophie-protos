syntax = "proto3";

package com.platform.task.v1;

option java_multiple_files = true;
option java_package = "org.sophie.taskservice.grpc";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";
import "common/pagination.proto";
import "common/export.proto";

// Task Service: projects, an org-wide task-type catalog, and per-project workflow (statuses +
// transitions). gRPC-only, internal (called behind the Gateway, which forwards the acting user's
// internal id as `requested_by`). Project access is resolved against Org Service's role_assignments at
// scope_type=PROJECT — Task Service never owns its own access model. Boards, labels, and tasks are
// follow-up steps (their tables are not created yet).
service TaskService {
  // Org export (claude/account-deletion-export-design.md §10), SERVICE tier, called by file-service only:
  // every project with its tasks, comments, activity and attachments.
  rpc ExportOrg(.org.sophie.common.ExportOrgRequest) returns (stream .org.sophie.common.ExportChunk);

  // ── Projects ──
  // Creates the project, grants the creator PROJECT access (AssignScopeRole → "Project Admin"), and
  // seeds a default workflow (To Do / In Progress / Done, permissive transitions).
  rpc CreateProject(CreateProjectRequest) returns (Project);
  rpc GetProject(GetProjectRequest) returns (Project);                       // requires project access
  rpc ListMyProjects(ListMyProjectsRequest) returns (ListMyProjectsResponse); // projects the caller is a MEMBER of, in an org
  // Open projects (visibility ORG) the caller can see but has not joined — the "browse" list. Any full org member
  // (a guest sees none). Each comes back with is_member = false.
  rpc ListOpenProjects(ListOpenProjectsRequest) returns (ListMyProjectsResponse);
  // Join an open project: the caller is given the org's "Project Member" role on it. Refused for a members-only
  // project and for a guest. Idempotent — already a member just returns the project.
  rpc JoinProject(JoinProjectRequest) returns (Project);

  // ── Components (claude/teams-work-structure-design.md §5.2) ──
  // An area or service inside a project, with an optional lead and default owning team. Any project member reads;
  // creating, editing and archiving need project manage access.
  rpc CreateComponent(CreateComponentRequest) returns (Component);
  rpc UpdateComponent(UpdateComponentRequest) returns (Component);
  rpc ListComponents(ListComponentsRequest) returns (ListComponentsResponse);
  rpc DeleteProject(DeleteProjectRequest) returns (google.protobuf.Empty);   // soft-delete; creator or project admin
  rpc UpdateProject(UpdateProjectRequest) returns (Project);                 // rename; creator or project admin

  // ── Task Types (org-wide catalog) ──
  rpc CreateTaskType(CreateTaskTypeRequest) returns (TaskType);              // org admin only
  rpc ListTaskTypes(ListTaskTypesRequest) returns (ListTaskTypesResponse);   // any org member
  rpc UpdateTaskType(UpdateTaskTypeRequest) returns (TaskType);              // org admin only
  rpc DeleteTaskType(DeleteTaskTypeRequest) returns (google.protobuf.Empty); // org admin only
  rpc SetTaskTypeIcon(SetTaskTypeIconRequest) returns (TaskType);            // org admin only
  rpc RemoveTaskTypeIcon(RemoveTaskTypeIconRequest) returns (TaskType);      // org admin only

  // ── Workflow (per-project) ──
  rpc CreateWorkflowStatus(CreateWorkflowStatusRequest) returns (WorkflowStatus);          // project admin
  rpc ListWorkflowStatuses(ListWorkflowStatusesRequest) returns (ListWorkflowStatusesResponse); // project member
  rpc UpdateWorkflowStatus(UpdateWorkflowStatusRequest) returns (WorkflowStatus);          // project admin
  rpc DeleteWorkflowStatus(DeleteWorkflowStatusRequest) returns (google.protobuf.Empty);   // project admin
  rpc ReorderWorkflowStatuses(ReorderWorkflowStatusesRequest) returns (ListWorkflowStatusesResponse); // project admin
  rpc CreateWorkflowTransition(CreateWorkflowTransitionRequest) returns (WorkflowTransition);   // project admin
  rpc ListWorkflowTransitions(ListWorkflowTransitionsRequest) returns (ListWorkflowTransitionsResponse); // project member
  rpc DeleteWorkflowTransition(DeleteWorkflowTransitionRequest) returns (google.protobuf.Empty); // project admin

  // ── Boards (any project member) ──
  rpc CreateBoard(CreateBoardRequest) returns (Board);
  rpc ListBoards(ListBoardsRequest) returns (ListBoardsResponse);
  rpc UpdateBoard(UpdateBoardRequest) returns (Board);
  rpc DeleteBoard(DeleteBoardRequest) returns (google.protobuf.Empty);

  // ── Team boards: one board over several projects (teams design §6.3). Org-level, not project-level. ──
  rpc CreateTeamBoard(CreateTeamBoardRequest) returns (TeamBoard);                 // full org member with access to every project chosen
  rpc ListTeamBoards(ListTeamBoardsRequest) returns (ListTeamBoardsResponse);      // boards where the caller can reach >= 1 project
  rpc GetTeamBoard(GetTeamBoardRequest) returns (TeamBoard);
  rpc UpdateTeamBoard(UpdateTeamBoardRequest) returns (TeamBoard);                 // board admin
  rpc DeleteTeamBoard(DeleteTeamBoardRequest) returns (google.protobuf.Empty);     // board admin; refused while it has sprints
  rpc ListTeamBoardTasks(ListTeamBoardTasksRequest) returns (ListTeamBoardTasksResponse); // only tasks in projects the caller can reach
  rpc MoveTeamBoardCard(MoveTeamBoardCardRequest) returns (Task);                  // to a column: the task's own project decides the status
  rpc RankTeamBoardCard(RankTeamBoardCardRequest) returns (google.protobuf.Empty); // order across projects: ranks are the board's own

  // ── Labels (any project member) ──
  rpc CreateLabel(CreateLabelRequest) returns (Label);
  rpc ListLabels(ListLabelsRequest) returns (ListLabelsResponse);
  rpc UpdateLabel(UpdateLabelRequest) returns (Label);
  rpc DeleteLabel(DeleteLabelRequest) returns (google.protobuf.Empty);

  // ── Tasks ──
  rpc CreateTask(CreateTaskRequest) returns (Task);
  rpc GetTask(GetTaskRequest) returns (Task);
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);        // one query for board + list
  rpc BatchGetTaskSummaries(BatchGetTaskSummariesRequest) returns (BatchGetTaskSummariesResponse); // cross-link enrichment
  rpc GetTaskByReference(GetTaskByReferenceRequest) returns (TaskSummary);                          // resolve KEY-NUMBER → task
  // REMOVED in 0.66.0: ResolveTaskReferenceInternal. Its only consumer, VCS webhook ingestion, moved
  // INTO this service, so the reference resolver is now a plain in-process call
  // (VcsReferenceUpsertService -> TaskService.resolveTaskReferenceInternal) and the RPC had no remote
  // caller left — an unauthenticated-by-design entry point serving nobody. Do not reuse the name.

  // ── VCS references (commits/branches/PRs/MRs linked to a task) ──
  // Caller (the Gateway) is trusted to have already validated the user's access to the task itself —
  // same delegation pattern GetTask's own callers use.
  rpc ListVcsReferencesForTask(ListVcsReferencesForTaskRequest) returns (ListVcsReferencesForTaskResponse);
  // Trusted-internal, called by integration-service after it verifies a GitHub/GitLab webhook's
  // signature — this service does the actual event parsing (commit-message task-reference regex,
  // PR/MR title+body) and upserts the resulting VcsReference rows. No user in context to check access
  // for, same trust tier as ResolveTaskReferenceInternal above.
  rpc ProcessVcsWebhookEvent(ProcessVcsWebhookEventRequest) returns (google.protobuf.Empty);
  // Trusted-internal, called by integration-service's DisconnectIntegration flow — mirrors the
  // app-level FK-integrity convention this platform already uses for every cross-service id (explicit
  // cleanup call, not a real FK, since the two tables now live in different databases).
  rpc DeleteVcsReferencesForConnection(DeleteVcsReferencesForConnectionRequest) returns (google.protobuf.Empty);
  rpc UpdateTask(UpdateTaskRequest) returns (Task);
  rpc ChangeTaskStatus(ChangeTaskStatusRequest) returns (Task);       // transition- + completion-validated
  rpc SetTaskParent(SetTaskParentRequest) returns (Task);             // one-level cap; null clears

  // ── Task comments (one-level replies; author-only edit/delete; tombstone-on-delete) ──
  rpc CreateTaskComment(CreateTaskCommentRequest) returns (TaskComment);
  rpc EditTaskComment(EditTaskCommentRequest) returns (TaskComment);
  rpc DeleteTaskComment(DeleteTaskCommentRequest) returns (google.protobuf.Empty);
  rpc ListTaskComments(ListTaskCommentsRequest) returns (ListTaskCommentsResponse);
  rpc ListTaskActivity(ListTaskActivityRequest) returns (ListTaskActivityResponse); // field/status change feed (History tab)
  rpc SetTaskEpic(SetTaskEpicRequest) returns (Task);                 // group under an epic; null clears

  // ── Initiatives: a level above epics, across projects (teams design §7) ──
  rpc CreateInitiative(CreateInitiativeRequest) returns (Task);                 // project member; makes the org's Initiative type on first use
  rpc SetTaskInitiative(SetTaskInitiativeRequest) returns (Task);               // access to the epic AND the initiative; null clears
  rpc GetInitiativeRollup(GetInitiativeRollupRequest) returns (InitiativeRollup); // computed with the caller's access
  rpc ListInitiatives(ListInitiativesRequest) returns (ListInitiativesResponse);  // the ones the caller can reach, summarised
  rpc RankTask(RankTaskRequest) returns (Task);                       // manual backlog reorder

  // ── Scrum sprints ──
  rpc CreateSprint(CreateSprintRequest) returns (Sprint);
  rpc UpdateSprint(UpdateSprintRequest) returns (Sprint);
  rpc ListSprints(ListSprintsRequest) returns (ListSprintsResponse);
  rpc StartSprint(StartSprintRequest) returns (Sprint);               // FUTURE → ACTIVE (one active per board)
  rpc CompleteSprint(CompleteSprintRequest) returns (Sprint);         // ACTIVE → COMPLETE; carries survivors
  rpc ReopenSprint(ReopenSprintRequest) returns (Sprint);            // COMPLETE → ACTIVE; no task moves
  rpc DeleteSprint(DeleteSprintRequest) returns (google.protobuf.Empty); // FUTURE only; tasks → backlog
  rpc MoveTaskToSprint(MoveTaskToSprintRequest) returns (Task);       // (re)assign one task; absent = backlog
  rpc MoveTasksToSprint(MoveTasksToSprintRequest) returns (MoveTasksToSprintResponse); // the same, in bulk
  rpc DeleteTask(DeleteTaskRequest) returns (google.protobuf.Empty);  // soft-delete + cascade; reporter/admin
  rpc AddTaskLabel(AddTaskLabelRequest) returns (google.protobuf.Empty);
  rpc RemoveTaskLabel(RemoveTaskLabelRequest) returns (google.protobuf.Empty);
  rpc BlockTask(BlockTaskRequest) returns (google.protobuf.Empty);
  rpc UnblockTask(UnblockTaskRequest) returns (google.protobuf.Empty);

  // ── Task ↔ Doc linking (delegates to Doc Service; validates task-side access first) ──
  // ── Unified search support (unified-search-design.md §5.2) ──
  // Every project id the caller can reach, for search's ACL PRE-filter. Ids only. Reuses
  // ProjectGuard/ListMyProjects' existing access logic (a PROJECT-scope role assignment in Org
  // Service) — search never writes its own access rules. Caller = the verified principal.
  rpc ListAccessibleProjectIds(ListAccessibleProjectIdsRequest) returns (ListAccessibleProjectIdsResponse);

  // Batched post-verification for search, mirroring Doc Service's FilterAccessiblePages: given
  // candidate task ids, return the subset the caller can see. Tasks have no per-task restriction
  // layer, so this is project access for each task's project, via ProjectGuard.hasAccess.
  rpc FilterAccessibleTasks(FilterAccessibleTasksRequest) returns (FilterAccessibleTasksResponse);

  // Backfill: write search-outbox upsert rows for existing projects and tasks in batches (D8).
  rpc RequestReindex(RequestReindexRequest) returns (RequestReindexResponse);

  rpc LinkDoc(LinkDocRequest) returns (google.protobuf.Empty);
  rpc UnlinkDoc(UnlinkDocRequest) returns (google.protobuf.Empty);
  rpc ListLinkedDocs(ListLinkedDocsRequest) returns (ListLinkedDocsResponse);

  // ── Task-level attachment shelf (mirrors Doc Service's page_attachment shelf) — files uploaded to
  // a task, whether or not embedded inline in the description's rich-text body. Description-embedded
  // files are tracked separately via a TASK_DESCRIPTION file-reference owner, reconciled on save the
  // same way Doc Service's ContentDocumentProcessor walk works (no version/draft split — a task
  // description is a live column, not a published-version model). ──
  rpc AttachFileToTask(AttachFileToTaskRequest) returns (TaskAttachment);
  rpc ListTaskAttachments(ListTaskAttachmentsRequest) returns (ListTaskAttachmentsResponse);
  rpc RemoveTaskAttachment(RemoveTaskAttachmentRequest) returns (google.protobuf.Empty);
  // Task-scoped download URL for a description-embedded file — mirrors Doc Service's
  // GetAttachmentDownloadUrl: verifies project access, then requires file_id resolve via either the
  // shelf or the description's own materialized references, before minting a presigned GET.
  rpc GetTaskAttachmentDownloadUrl(GetTaskAttachmentDownloadUrlRequest) returns (GetTaskAttachmentDownloadUrlResponse);
  // Paste-driven internal re-reference (Flow B): links a file the caller already has read access to —
  // via source_kind/source_id, verified against that source's own service (PAGE → Doc Service,
  // MESSAGE → Chat Service, TASK → this same check against a different task) — onto target_task_id's
  // shelf, without re-uploading. A bare file_id proves nothing on its own.
  rpc ReferenceExistingFileForTask(ReferenceExistingFileForTaskRequest) returns (TaskAttachment);

  // Requires project.manage. Caller identity comes from the gRPC principal, never the body.
  rpc SetProjectAvatar(SetProjectAvatarRequest) returns (Project);
  rpc RemoveProjectAvatar(RemoveProjectAvatarRequest) returns (Project);

  // ── Custom fields (custom-fields-design.md) ───────────────────────────────────────────────
  // Definitions are an ORG catalog (org admin), attached per project (project manage), with values set
  // by anyone who can edit the task. Create/Restore/Attach are plan-gated; value writes and every read
  // never are, so a downgraded org keeps full use of the fields it already has (design D7).
  rpc CreateCustomField(CreateCustomFieldRequest) returns (CustomField);
  rpc UpdateCustomField(UpdateCustomFieldRequest) returns (CustomField);
  // Soft delete: hides the field everywhere, keeps every value. Reversible until PurgeCustomField.
  rpc DeleteCustomField(DeleteCustomFieldRequest) returns (google.protobuf.Empty);
  // Optional name lets the caller resolve a collision with a live field (design D3a).
  rpc RestoreCustomField(RestoreCustomFieldRequest) returns (CustomField);
  // Irreversible. Cascades to options, attachments and every stored value.
  rpc PurgeCustomField(PurgeCustomFieldRequest) returns (google.protobuf.Empty);
  rpc ListCustomFields(ListCustomFieldsRequest) returns (ListCustomFieldsResponse);

  rpc CreateFieldOption(CreateFieldOptionRequest) returns (FieldOption);
  rpc UpdateFieldOption(UpdateFieldOptionRequest) returns (FieldOption);
  // Removes the option from every task by DB cascade, for both DROPDOWN and LABELS.
  rpc DeleteFieldOption(DeleteFieldOptionRequest) returns (google.protobuf.Empty);
  rpc ReorderFieldOptions(ReorderFieldOptionsRequest) returns (ListFieldOptionsResponse);

  rpc AttachFieldToProject(AttachFieldToProjectRequest) returns (ProjectField);
  rpc DetachFieldFromProject(DetachFieldFromProjectRequest) returns (google.protobuf.Empty);
  rpc UpdateProjectField(UpdateProjectFieldRequest) returns (ProjectField);
  rpc ListProjectFields(ListProjectFieldsRequest) returns (ListProjectFieldsResponse);

  // Several fields in one transaction. A FieldValue with no value set CLEARS that field.
  rpc SetTaskFieldValues(SetTaskFieldValuesRequest) returns (Task);

  // ── Staff-tier (admin panel) ──────────────────────────────────────────────────────────────
  // Any active staff member or trusted internal service may call this — no live platform_staff
  // re-check, same accepted read-only trust level as every other staff-tier READ this admin-panel
  // effort has built. "Open" = workflow_statuses.is_completion_status = false, joined through
  // tasks -> workflow_statuses and tasks -> projects (Task has no org_id of its own; Project does).
  rpc GetOpenTaskCountForStaff(GetOpenTaskCountForStaffRequest) returns (GetOpenTaskCountForStaffResponse);

  // ── Telegram (/my) ────────────────────────────────────────────────────────────────────────
  // The caller's open tasks (assignee = caller, status not a completion status) across every project
  // in org_id they can still access, soonest due date first (no due date last), then newest. Caller =
  // the verified principal (USER or a telegram-service ASSERTED_USER, see PRINCIPAL_TIERS.md).
  rpc ListMyOpenTasks(ListMyOpenTasksRequest) returns (ListMyOpenTasksResponse);

  // ── Project templates + features (claude/project-templates-design.md) ──
  // A template is a SEED, not a type: CreateProject.template_key writes statuses, transitions, task
  // types and a feature set into an ordinary project. Behaviour afterwards follows the features only.
  rpc ListProjectTemplates(ListProjectTemplatesRequest) returns (ListProjectTemplatesResponse); // any caller
  rpc ListProjectFeatures(ListProjectFeaturesRequest) returns (ListProjectFeaturesResponse);    // project member
  rpc SetProjectFeature(SetProjectFeatureRequest) returns (ListProjectFeaturesResponse);       // project manager

  // ── Sprint reports (computed on read from sprint_scope_events) ──
  rpc GetSprintBurndown(GetSprintBurndownRequest) returns (SprintBurndown);                   // project member
  rpc ListSprintVelocity(ListSprintVelocityRequest) returns (ListSprintVelocityResponse);     // project member

  // ── Dashboards: metrics, metric settings, health (claude/dashboards-design.md §10) ──
  // Results and settings travel as JSON documents owned by task-service (the metric catalogue's shapes
  // and the validated settings document); the gateway passes them through untouched. Every metric is
  // scoped to the requested ∩ the caller's accessible projects — no admin bypass — and per-person
  // numbers follow the analytics.view_people rules.
  rpc RunMetric(RunMetricRequest) returns (MetricJson);                                        // org member
  rpc DrillDownMetric(DrillDownMetricRequest) returns (MetricJson);                            // org member
  rpc GetProjectAnalyticsSettings(GetProjectAnalyticsSettingsRequest) returns (ProjectAnalyticsSettings);    // project member
  rpc UpdateProjectAnalyticsSettings(UpdateProjectAnalyticsSettingsRequest) returns (ProjectAnalyticsSettings); // project manager
  rpc ResetProjectAnalyticsSettings(ResetProjectAnalyticsSettingsRequest) returns (ProjectAnalyticsSettings);   // project manager
  rpc PreviewProjectHealth(PreviewProjectHealthRequest) returns (MetricJson);                  // project member
  rpc GetOrgAnalyticsDefaults(GetOrgAnalyticsDefaultsRequest) returns (OrgAnalyticsDefaults);  // org member
  rpc UpdateOrgAnalyticsDefaults(UpdateOrgAnalyticsDefaultsRequest) returns (OrgAnalyticsDefaults); // org admin
  rpc ListMetricPresets(ListMetricPresetsRequest) returns (MetricJson);                        // org member

  // ── Dashboards: saved dashboards and each project's Reports dashboard (claude/dashboards-design.md §9) ──
  // Visibility PRIVATE | ORG | SHARED | PROJECT. An unseen dashboard is NOT_FOUND; seeing one grants nothing
  // about its data (every widget runs with the viewer's own project access).
  rpc ListDashboards(ListDashboardsRequest) returns (ListDashboardsResponse);                  // org member
  rpc GetDashboard(GetDashboardRequest) returns (Dashboard);                                   // can see it
  rpc CreateDashboard(CreateDashboardRequest) returns (Dashboard);                             // org member; dashboards.max
  rpc UpdateDashboard(UpdateDashboardRequest) returns (Dashboard);                             // can edit it
  rpc SaveDashboardLayout(SaveDashboardLayoutRequest) returns (Dashboard);                     // can edit it
  rpc DeleteDashboard(DeleteDashboardRequest) returns (DeleteDashboardResponse);               // owner / org admin
  rpc DuplicateDashboard(DuplicateDashboardRequest) returns (Dashboard);                       // can see it; dashboards.max
  rpc SetDashboardShares(SetDashboardSharesRequest) returns (Dashboard);                       // owner
  rpc UpdateDashboardViewerState(UpdateDashboardViewerStateRequest) returns (DashboardViewerState); // can see it; the caller's own state
  rpc ListDashboardTemplates(ListDashboardTemplatesRequest) returns (ListDashboardTemplatesResponse); // any caller
  // The saved Reports dashboard, or the template for the project's preset (id empty) until a manager saves.
  rpc GetProjectReportsDashboard(GetProjectReportsDashboardRequest) returns (Dashboard);       // project member
  rpc SaveProjectReportsDashboard(SaveProjectReportsDashboardRequest) returns (Dashboard);     // project manager
  rpc ResetProjectReportsDashboard(ResetProjectReportsDashboardRequest) returns (ResetProjectReportsDashboardResponse); // project manager

  // ── Time tracking (claude/dashboards-design.md §5) ──
  // Opt-in per project (the TIME_TRACKING feature); never a gate on anything else. Your own time: anyone with
  // project access. Someone else's: project.worklog_manage holders, where the project allows it.
  rpc GetProjectTimeSettings(GetProjectTimeSettingsRequest) returns (ProjectTimeSettings);           // project member
  rpc UpdateProjectTimeSettings(UpdateProjectTimeSettingsRequest) returns (ProjectTimeSettings);     // project manager
  rpc GetOrgTimeDefaults(GetOrgTimeDefaultsRequest) returns (OrgTimeDefaults);                       // org member
  rpc UpdateOrgTimeDefaults(UpdateOrgTimeDefaultsRequest) returns (OrgTimeDefaults);                 // org admin
  rpc GetTaskTime(GetTaskTimeRequest) returns (TaskTime);                                            // project member
  rpc LogWork(LogWorkRequest) returns (Worklog);                                                     // project member
  rpc UpdateWorklog(UpdateWorklogRequest) returns (Worklog);                                         // owner / worklog manager
  rpc DeleteWorklog(DeleteWorklogRequest) returns (DeleteWorklogResponse);                           // owner / worklog manager
  rpc SetTaskEstimate(SetTaskEstimateRequest) returns (TaskTime);                                    // project member
  rpc StartTimer(StartTimerRequest) returns (RunningTimer);                                          // project member
  rpc StopTimer(StopTimerRequest) returns (StopTimerResponse);                                       // the timer's owner
  rpc DiscardTimer(DiscardTimerRequest) returns (DiscardTimerResponse);                              // the timer's owner
  rpc GetMyTimer(GetMyTimerRequest) returns (GetMyTimerResponse);                                    // any caller
  rpc GetTimesheet(GetTimesheetRequest) returns (Timesheet);                                         // org member; others need view-people

  // ── Archive (Trello-style: off every view, nothing deleted; restorable) ──
  rpc SetTaskArchived(SetTaskArchivedRequest) returns (Task);                                  // project member
  rpc ArchiveTasksInStatus(ArchiveTasksInStatusRequest) returns (ArchiveTasksInStatusResponse); // project member

  // ── Import (claude/atlassian-import-design.md §14.1) ──
  // SERVICE tier, called only by import-service, which has already checked that imported_by is an Org
  // Admin of org_id. Every row carries an id the caller chose up front, and every write is
  // insert-if-absent by that id: a resent batch reports the rows as existing_ids and changes nothing.
  // Each call is one transaction — a bad row fails the whole batch with INVALID_ARGUMENT naming it.
  // None of these notify anyone, publish live events, or write activity rows; search indexing happens
  // as usual through the outbox. They only ever CREATE — there is no import update or delete.
  rpc ImportProject(ImportProjectRequest) returns (Project);
  rpc ImportTaskTypes(ImportTaskTypesRequest) returns (ImportBatchResponse);
  rpc ImportCustomFields(ImportCustomFieldsRequest) returns (ImportBatchResponse);
  rpc ImportSprints(ImportSprintsRequest) returns (ImportBatchResponse);
  rpc ImportTasks(ImportTasksRequest) returns (ImportBatchResponse);
  rpc ImportTaskBlocks(ImportTaskBlocksRequest) returns (ImportBatchResponse);
  rpc ImportTaskComments(ImportTaskCommentsRequest) returns (ImportBatchResponse);
  // Raises next_task_number above every imported number. Safe to call more than once.
  rpc FinishProjectImport(FinishProjectImportRequest) returns (Project);
}

// ===================== Messages =====================

message Project {
  string id = 1;
  string org_id = 2;
  string key = 3;
  string name = 4;
  string description = 5;
  string created_by = 6;
  google.protobuf.Timestamp created_at = 7;
  // Server-derived: creator, project admin, or a "project.manage" permission holder. Lets the
  // frontend show/hide management controls without guessing — see ProjectGuard.canManage.
  bool can_manage = 8;
  string avatar_version = 9; // empty = no avatar set; frontend renders the monogram
  // The template this project was seeded from ("kanban" | "scrum" | "waterfall") and its version.
  // Recorded for analytics and display only — behaviour is driven by ListProjectFeatures, never by this.
  string template_key = 10;
  int32 template_version = 11;
  // The team's default board-card fields, set by a project manager (claude/project-templates-design.md
  // §15). Only meaningful when has_default_card_fields; otherwise clients use the platform default.
  // Each viewer may still choose their own for this project.
  repeated string default_card_fields = 12;
  bool has_default_card_fields = 13;
  // "MEMBERS" (default: only people given a role on it) or "ORG" (open: every full member of the org — not a
  // guest — may view, comment and create tasks; changing settings still needs a role).
  string visibility = 14;
  // Whether the caller holds a role on it (directly or through a team). False only for an open project the
  // caller is looking at without having joined.
  bool is_member = 15;
  // The team that owns new tasks here when neither the task nor its component names one. Absent = none.
  optional string default_team_id = 16;
}

// Wrapper so an update can say "set to this list" (even an empty one) apart from "leave unchanged".
message CardFieldList {
  repeated string fields = 1;
}

message TaskType {
  string id = 1;
  string org_id = 2;
  string name = 3;
  // An icon ID from the client's closed set (e.g. "diamond-outline"), NOT a glyph character. Storing
  // the id lets the icon be redrawn as an SVG without a data migration, and keeps the value renderable
  // in a client that has no font for whatever character an org picked. Absent = none.
  optional string icon = 4;
  google.protobuf.Timestamp created_at = 5;
  // A colour ramp KEY (e.g. "blue"), not a hex. The key maps to a different hex in light and dark
  // themes, which a stored "#34618e" could never do. Absent = none.
  optional string color = 6;
  // Live tasks carrying this type. Populated on list only, from one grouped query — it is what lets a
  // client state the cost of a delete before attempting one the server would refuse.
  int32 usage_count = 7;
  // Set when the org uploaded its own mark for this type, in which case it wins over `icon`. The value
  // is the avatar version (a content hash), so the URL changes whenever the image does and the old one
  // stays cacheable forever. Served from the normal avatar path with owner_type TASK_TYPE.
  optional string icon_version = 8;
  // Stable identity for types a template needs ("epic", "story", "task", "bug", "subtask", "phase",
  // "milestone"). Matched by key, never by name, so an org's rename survives. Absent = an org's own type.
  optional string system_key = 9;
}

message WorkflowStatus {
  string id = 1;
  string project_id = 2;
  string name = 3;
  int32 order_index = 4;
  bool is_completion_status = 5;
  google.protobuf.Timestamp created_at = 6;
  // TODO | IN_PROGRESS | DONE. The source of truth for "is this work finished"; is_completion_status is
  // kept equal to (status_group == DONE) for older clients.
  string status_group = 7;
  // A colour ramp KEY ("blue"), like TaskType.color — the board list's colour (Trello-style) and the
  // status chip's everywhere. Absent = derived by the client from the status's place in the workflow.
  optional string color = 8;
}

message WorkflowTransition {
  string id = 1;
  string project_id = 2;
  string from_status_id = 3;
  string to_status_id = 4;
}

// ── Projects ──

message CreateProjectRequest {
  reserved 1; // was: requested_by (phase-2 identity field, deleted)
  reserved "requested_by";
  string org_id = 2;
  string key = 3;          // unique per org
  string name = 4;
  string description = 5;  // optional
  // "kanban" | "scrum" | "waterfall". Empty = kanban (the behaviour every project had before templates).
  string template_key = 6;
  // Waterfall only: also create the five standard phases (Requirements … Deployment).
  bool seed_phases = 7;
  // uz | en | ru — the language the seeded statuses and phases are named in. Empty = en.
  string locale = 8;
  // "MEMBERS" | "ORG". Empty = MEMBERS.
  string visibility = 9;
}

message GetProjectRequest {
  reserved 1; // was: requested_by (phase-2 identity field, deleted)
  reserved "requested_by";
  string project_id = 2;
}

message ListMyProjectsRequest {
  reserved 1; // was: requested_by (phase-2 identity field, deleted)
  reserved "requested_by";
  string org_id = 2;
}

message ListMyProjectsResponse {
  repeated Project projects = 1;
}

message DeleteProjectRequest {
  reserved 1; // was: requested_by (phase-2 identity field, deleted)
  reserved "requested_by";
  string project_id = 2;
}

message UpdateProjectRequest {
  reserved 1; // was: requested_by (phase-2 identity field, deleted)
