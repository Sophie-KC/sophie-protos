syntax = "proto3";

package com.platform.integration.v1;

option java_multiple_files = true;
option java_package = "org.sophie.integrationservice.grpc";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

// Generic per-org connections to an external provider (GitHub, GitLab, and later Google/Microsoft
// for calendar sync) — OAuth/install flow, encrypted token storage, and connection lifecycle only.
// Provider-domain logic (VCS commit/PR/MR reference tracking, calendar event sync, ...) lives in
// whichever service owns that domain and calls back here only for a token or to register a webhook
// delivery target — this service never interprets what a provider's data means.
service IntegrationService {
  // Org admin: every connection in the org. Non-admin org member: only their own self-service
  // connections (GOOGLE) — GitHub/GitLab are org-wide and admin-managed, invisible to a non-admin
  // caller here. Never returns the encrypted token fields — those never leave this service over the
  // wire.
  rpc ListConnections(ListConnectionsRequest) returns (ListConnectionsResponse);
  // Org admin: deletes any connection (incl. offboarding a member's Google connection). Non-admin:
  // may delete only a GOOGLE connection they themselves connected (connected_by == caller).
  rpc DisconnectIntegration(DisconnectIntegrationRequest) returns (google.protobuf.Empty);

  // Org admin only. Returns the GitHub App's installation URL for the frontend to redirect the org
  // admin's browser to. GitHub redirects back to this service's own HTTP callback (not gRPC — see
  // /integrations/github/callback) after the admin installs, carrying installation_id/setup_action/state.
  rpc InitiateInstallation(InitiateInstallationRequest) returns (InitiateInstallationResponse);

  // Org admin only. Returns GitLab's OAuth authorize URL, reusing the same signed single-use state-token
  // mechanism as InitiateInstallation (state.provider = "GITLAB" instead of "GITHUB"). GitLab redirects
  // back to /integrations/gitlab/callback (HTTP, not gRPC) carrying code + state.
  rpc InitiateGitLabOAuth(InitiateGitLabOAuthRequest) returns (InitiateGitLabOAuthResponse);
  // A GitLab account can belong to many groups — the callback can't pick one on its own, so it stops
  // after token exchange + fetching the user's groups and hands back a short-lived selection_token (see
  // vcs_gitlab_pending_selections) instead of a finished connection. This RPC is the follow-up call that
  // finalizes it: re-checks org-admin status, creates the connections row with real encrypted tokens,
  // lists the group's projects, and registers a webhook on each one. Org admin only.
  rpc ConfirmGitLabGroupSelection(ConfirmGitLabGroupSelectionRequest) returns (Connection);

  // Self-service: any org MEMBER (not just admins) — Google Calendar is inherently personal, and
  // Google's own OAuth consent requires the actual account holder to authenticate, so an admin
  // cannot connect on someone else's behalf. Returns Google's OAuth authorize URL, reusing the same
  // signed single-use state-token mechanism as InitiateInstallation/InitiateGitLabOAuth
  // (state.provider = "GOOGLE"). Unlike GitLab, a Google account needs no group/project selection at
  // connect time — which calendars to sync is decided later, in calendar-service's sync-setup UI —
  // so Google's callback (/integrations/google/callback, HTTP, not gRPC) finishes the connection in
  // one step and there is no confirm-selection follow-up RPC.
  rpc InitiateGoogleOAuth(InitiateGoogleOAuthRequest) returns (InitiateGoogleOAuthResponse);

  // Internal only (SP-tier) — calendar-service calls this to get a live, refreshed Google access
  // token for a connection it has already verified (via ListConnections) belongs to the caller. No
  // requested_by field, no access check here by design — ownership is the caller's responsibility,
  // same trust model as task_service.proto's ResolveTaskReferenceInternal.
  //
  // NOTE: no RegisterWebhook RPC yet — nothing in the current split needs it (GitLab webhook
  // registration stays entirely inside ConfirmGitLabGroupSelection's own flow). Add it when
  // calendar-service's webhook-driven sync (build order step 5) actually needs it.
  rpc GetAccessToken(GetAccessTokenRequest) returns (GetAccessTokenResponse);

  // ── Provider profiles (vcs-integration-onprem-design.md §5) ──────────────────────────────────
  // Which GitHub / GitLab *app* and *instance* an org connects through. PLATFORM = Sophie's own app
  // on github.com / gitlab.com (the implicit default when no row exists — nothing changes for cloud
  // orgs that never touch this); CUSTOM = the org's own app, possibly on a self-hosted GHES / GitLab.
  // Org admin only. Secrets are write-only: GetProviderProfile reports presence, never values.
  rpc GetProviderProfile(GetProviderProfileRequest) returns (ProviderProfile);
  // Full replace of the org's profile for one provider. Omitted secret fields on an existing CUSTOM
  // profile keep their stored values (so an admin can edit the base URL without re-pasting a PEM).
  rpc UpsertProviderProfile(UpsertProviderProfileRequest) returns (ProviderProfile);
  // Back to the platform default. Existing connections made through the custom profile are marked
  // needs_reconnect rather than deleted.
  rpc ClearProviderProfile(ClearProviderProfileRequest) returns (ProviderProfile);

  // Mode 2 for GitHub without PEM copy-pasting: the GitHub App Manifest flow (design §8). Returns the
  // manifest the org admin's browser must form-POST to `target_url`; GitHub creates the app and
  // redirects to /integrations/github/manifest/callback (HTTP) with a code this service converts into
  // the app's id/slug/PEM/webhook secret, stored straight into the org's CUSTOM profile. Org admin only.
  rpc StartGitHubAppManifest(StartGitHubAppManifestRequest) returns (StartGitHubAppManifestResponse);

  // "Is my server reachable from the Git host?" — asks the provider to report its last delivery to
  // this deployment's webhook URL (GitHub: the App's latest hook delivery; GitLab: a test push on the
  // first registered project hook). Needs an existing connection. Org admin only.
  rpc TestWebhookDelivery(TestWebhookDeliveryRequest) returns (TestWebhookDeliveryResponse);

  // Runs one polling pass for a connection right now (design §7) instead of waiting for the
  // scheduler — for an admin who just switched to POLL delivery and wants to see it work. Org admin
  // only; returns what the pass found.
  rpc SyncConnectionNow(SyncConnectionNowRequest) returns (SyncConnectionNowResponse);
}

message Connection {
  string id = 1;
  string org_id = 2;
  string provider = 3;                // GITHUB, GITLAB, GOOGLE
  string external_account_id = 4;
  string external_account_name = 5;
  string connected_by = 6;
  google.protobuf.Timestamp connected_at = 7;
  // access_token / refresh_token are intentionally NOT exposed here — encrypted at rest, never returned.
  // True if the provider's refresh-token exchange failed (revoked/expired beyond recovery) — sync/
  // webhooks for this connection will silently stop until the org admin reconnects. Always false for
  // GitHub (installation tokens are minted fresh per call, nothing to "expire" at the connection level).
  bool needs_reconnect = 8;
  // Polling reconciliation (vcs-integration-onprem-design.md §7): when this connection's repos were
  // last listed for new commits / PRs / MRs, and the last error if that pass failed. Zero/empty
  // when it has never been polled (a DIRECT-webhook connection is only polled by the safety net).
  google.protobuf.Timestamp last_synced_at = 9;
  string last_sync_error = 10;
}

message ListConnectionsRequest {
  string org_id = 1;
}

message ListConnectionsResponse {
  repeated Connection connections = 1;
}

message DisconnectIntegrationRequest {
  string connection_id = 1;
}

message InitiateInstallationRequest {
  string org_id = 1;
  string provider = 2; // GITHUB only for now; GITLAB reserved for Stage 3
}

message InitiateInstallationResponse {
  string installation_url = 1;
}

message InitiateGitLabOAuthRequest {
  string org_id = 1;
}

message InitiateGitLabOAuthResponse {
  string authorize_url = 1;
}

message ConfirmGitLabGroupSelectionRequest {
  string selection_token = 1;
  string group_id = 2; // one of the ids returned in the callback's group list
}

message InitiateGoogleOAuthRequest {
  string org_id = 1;
}

message InitiateGoogleOAuthResponse {
  string authorize_url = 1;
}

message GetAccessTokenRequest {
  string connection_id = 1;
}

message GetAccessTokenResponse {
  string access_token = 1;
  google.protobuf.Timestamp expires_at = 2;
  // Internal user id that owns this connection (Connection.connected_by). Lets a caller that has no
  // per-request identity of its own (e.g. calendar-service's background poll job) re-verify ownership
  // on every call, rather than trusting a check done once at connect time — see
  // GoogleCalendarSyncService.pollConnection in calendar-service for why that trust was misplaced.
  string connected_by = 3;
}

// ── Provider profiles ────────────────────────────────────────────────────────────────────────────

message GetProviderProfileRequest {
  string org_id = 1;
  string provider = 2; // GITHUB | GITLAB
}

message ProviderProfile {
  string org_id = 1;
  string provider = 2;
  string mode = 3;              // PLATFORM | CUSTOM
  string base_url = 4;          // https://github.com | https://ghe.example | https://gitlab.example
  string api_base_url = 5;      // https://api.github.com | https://ghe.example/api/v3 | <gitlab>/api/v4
  string webhook_delivery = 6;  // DIRECT | POLL | RELAY
  // Read-only, derived from the deployment's public URL — what the admin must register on their app.
  string callback_url = 7;
  string webhook_url = 8;
  // CUSTOM only — non-secret identifiers, plus presence flags for the secrets (never the values).
  string github_app_id = 9;
  string github_app_slug = 10;
  bool github_private_key_set = 11;
  bool github_webhook_secret_set = 12;
  string gitlab_client_id = 13;
  bool gitlab_client_secret_set = 14;
  string updated_at = 15;       // RFC 3339; empty for the implicit platform default
  // Whether Sophie's own app for this provider is configured on this deployment at all — decides
  // whether "use Sophie's app" is even offered (an on-prem install without our credentials has only
  // its own app to use).
  bool platform_app_available = 16;
  // True on a hosted-connector SPOKE (design §6): "Sophie's app" here means through the Sophie KC
  // cloud hub, and webhook_delivery may be RELAY (events pulled from the hub) as well as DIRECT.
  bool hosted = 17;
}

message UpsertProviderProfileRequest {
  string org_id = 1;
  string provider = 2;
  string mode = 3;              // PLATFORM (explicit pin) | CUSTOM
  string base_url = 4;          // blank = provider's public instance
  string api_base_url = 5;      // blank = derived from base_url
  string webhook_delivery = 6;  // blank = DIRECT
  // CUSTOM/GITHUB
  string github_app_id = 7;
  string github_app_slug = 8;
  string github_private_key_pem = 9;   // write-only; blank keeps the stored value
  string github_webhook_secret = 10;   // write-only; blank keeps the stored value
  // CUSTOM/GITLAB
  string gitlab_client_id = 11;
  string gitlab_client_secret = 12;    // write-only; blank keeps the stored value
}

message ClearProviderProfileRequest {
  string org_id = 1;
  string provider = 2;
}

// ── GitHub App Manifest flow ─────────────────────────────────────────────────────────────────────

message StartGitHubAppManifestRequest {
  string org_id = 1;
  string base_url = 2;          // blank = https://github.com; a GitHub Enterprise Server otherwise
  string github_owner = 3;      // blank = the admin's personal account; a GitHub org login to make it org-owned
  string webhook_delivery = 4;  // DIRECT | POLL — stored on the resulting profile
}

message StartGitHubAppManifestResponse {
  string target_url = 1;        // where to form-POST `manifest` (already carries ?state=)
  string manifest_json = 2;
  string state = 3;
}

message TestWebhookDeliveryRequest {
  string org_id = 1;
  string provider = 2;
}

message TestWebhookDeliveryResponse {
  bool reachable = 1;
  string detail = 2;            // human-readable: the delivery's status, or why the test couldn't run
}

// ── Polling reconciliation ───────────────────────────────────────────────────────────────────────

message SyncConnectionNowRequest {
  string connection_id = 1;
}

message SyncConnectionNowResponse {
  int32 repositories = 1;
  int32 commits = 2;
  int32 pull_requests = 3;      // PRs or MRs
  string error = 4;             // empty on success
  Connection connection = 5;    // with the updated last_synced_at
}
