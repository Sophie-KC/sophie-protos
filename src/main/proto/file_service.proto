syntax = "proto3";

package com.platform.file.v1;

option java_multiple_files = true;
option java_package = "org.sophie.fileservice.grpc";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

// File Service: presigned upload/download flow over MinIO. gRPC-only, internal service-to-service —
// there is NO caller-identity/permission check here (no x-user-id interceptor like other services):
// the calling service (Chat Service now, Doc Service later) is responsible for having verified the
// user may upload/attach/download before calling. Object bytes never transit this service — clients
// PUT/GET them directly against MinIO via short-lived presigned URLs.
service FileService {
  // Dedups on (org_id, checksum) against ACTIVE files: on a hit, returns the existing file with
  // already_exists=true and no upload URL (caller skips straight to AttachFileReference). On a miss,
  // creates a PENDING row + a presigned PUT URL.
  rpc RequestUpload(RequestUploadRequest) returns (RequestUploadResponse);
  // Verifies the object actually exists in MinIO at the expected key and matches the expected size,
  // then flips PENDING -> ACTIVE and sets confirmed_at. Fails (does NOT activate) if the object is
  // missing or the size doesn't match — the client-reported checksum is never trusted blindly.
  rpc ConfirmUpload(ConfirmUploadRequest) returns (File);
  // Metadata only — never the bytes (see GetDownloadUrl for content access).
  rpc GetFile(GetFileRequest) returns (File);
  // Links a file to an entity (MESSAGE | PAGE | APP_ICON). Idempotent. Caller has already authorized the link.
  rpc AttachFileReference(AttachFileReferenceRequest) returns (google.protobuf.Empty);
  // Short-lived presigned GET URL for an ACTIVE file. Caller has already authorized the access.
  rpc GetDownloadUrl(GetDownloadUrlRequest) returns (GetDownloadUrlResponse);

  // Wholesale replace of every reference row for one (owner_type, owner_id): rows for file_ids not in
  // the given set are deleted, rows for file_ids not yet present are inserted. Idempotent — re-sending
  // the same set is a no-op. Empty file_ids revokes every reference this owner holds. Drives the
  // unreferenced_since bookkeeping (set on drop-to-zero, cleared on any new reference) in the same
  // transaction as the reference write — the sweeper never recomputes it.
  rpc ReplaceReferences(ReplaceReferencesRequest) returns (google.protobuf.Empty);
  // Convenience for ReplaceReferences with an empty file_ids set.
  rpc RevokeOwner(RevokeOwnerRequest) returns (google.protobuf.Empty);
  // Debug/admin: how many owners currently reference a file. Not used by the GC sweeper itself (which
  // re-checks inside its own delete transaction).
  rpc GetReferenceCount(GetReferenceCountRequest) returns (GetReferenceCountResponse);

  // Avatars have a separate lifecycle from attachments: no dedup, no reference counting, no orphan
  // sweeper. Bytes are decoded and re-encoded here, then served through the Gateway proxy — never
  // presigned, because an avatar is rendered hundreds of times per screen and an expiring URL cannot
  // be cached.
  rpc SetAvatar(SetAvatarRequest) returns (Avatar);
  rpc GetAvatar(GetAvatarRequest) returns (Avatar);
  rpc DeleteAvatar(DeleteAvatarRequest) returns (google.protobuf.Empty);
  rpc StreamAvatar(StreamAvatarRequest) returns (stream AvatarChunk);
}

message File {
  string id = 1;
  string org_id = 2;
  // NOT a phase-2-spoofable identity field: File Service does no authorization with this value (it's
  // SP-tier, no caller-identity gating by design) — it's audit data forwarded by the Gateway, which
  // already resolved it from the verified uploader's session before calling here.
  string uploaded_by = 3;
  string storage_bucket = 4;
  string storage_key = 5;
  string file_name = 6;
  string mime_type = 7;
  int64 size_bytes = 8;
  string checksum = 9;                              // client-computed SHA-256 (hex)
  string status = 10;                               // PENDING | ACTIVE | ORPHANED
  google.protobuf.Timestamp created_at = 11;
  optional google.protobuf.Timestamp confirmed_at = 12;
  optional google.protobuf.Timestamp deleted_at = 13;
}

message RequestUploadRequest {
  string org_id = 1;
  // NOT phase-2-spoofable: see File.uploaded_by above — File Service does no authz with it.
  string uploaded_by = 2;
  string file_name = 3;
  string mime_type = 4;
  int64 size_bytes = 5;
  string checksum = 6;      // client-computed SHA-256 (hex), used for (org_id, checksum) dedup
}

message RequestUploadResponse {
  string file_id = 1;
  bool already_exists = 2;         // true = same-checksum ACTIVE file already exists in this org
  string upload_url = 3;           // presigned PUT URL; empty when already_exists
  int32 expires_in_seconds = 4;    // upload URL lifetime; 0 when already_exists
}

message ConfirmUploadRequest {
  string file_id = 1;
}

message GetFileRequest {
  string file_id = 1;
}

message AttachFileReferenceRequest {
  string file_id = 1;
  string entity_type = 2;   // MESSAGE | PAGE | APP_ICON | AVATAR_SOURCE
  string entity_id = 3;
}

message GetDownloadUrlRequest {
  string file_id = 1;
  // false (default) = presigned URL forces Content-Disposition: attachment, safe for any content
  // type including SVG/HTML. true = no override, letting the browser render supported types inline —
  // callers must only set this for a content-type allowlist they've verified is safe to render
  // (e.g. doc-service's image embeds), never for a generic file attachment.
  bool inline = 2;
}

message GetDownloadUrlResponse {
  string download_url = 1;
  int32 expires_in_seconds = 2;
}

message ReplaceReferencesRequest {
  string org_id = 1;
  // DOC_PAGE_VERSION | DOC_PAGE_DRAFT | DOC_PAGE_SHELF | MESSAGE | APP_ICON | AVATAR_SOURCE
  string owner_type = 2;
  string owner_id = 3;
  repeated string file_ids = 4;
}

message RevokeOwnerRequest {
  string owner_type = 1;
  string owner_id = 2;
}

message GetReferenceCountRequest {
  string file_id = 1;
}

message GetReferenceCountResponse {
  int32 count = 1;
}

message SetAvatarRequest {
  string owner_type     = 1;   // USER | ORG | SPACE | CONVERSATION | PROJECT
  string owner_id       = 2;
  string org_id         = 3;   // empty for USER
  string source_file_id = 4;   // an ACTIVE file uploaded through the normal flow
  // NOT phase-2-spoofable: see File.uploaded_by above — File Service does no authz with it. Audit only.
  string updated_by     = 5;
}

message Avatar {
  string owner_type = 1;
  string owner_id = 2;
  string version = 3;
  string content_type = 4;
  repeated int32 sizes = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message GetAvatarRequest {
  string owner_type = 1;
  string owner_id = 2;
}

message DeleteAvatarRequest {
  string owner_type = 1;
  string owner_id = 2;
}

message StreamAvatarRequest {
  string owner_type = 1;
  string owner_id = 2;
  string version = 3;
  int32 size = 4;
}

message AvatarChunk {
  bytes data = 1;
}
