plugins {
    id 'java-library'
    id 'com.google.protobuf' version '0.9.4'
    id 'maven-publish'
}

group = 'org.sophie'
// DECLARED_VERSION is the human-bumped source of truth. At release the publish workflow passes
// -PreleaseVersion=<tag without the leading v> so the PUBLISHED version comes from the git tag, and it
// asserts the tag equals DECLARED_VERSION first (fails otherwise) — so a v0.2.0 tag can never publish
// while build.gradle still says 0.1.0. Local publishToMavenLocal (no -P) uses DECLARED_VERSION as-is.
ext.DECLARED_VERSION = '0.17.0'
version = project.findProperty('releaseVersion') ?: DECLARED_VERSION
description = 'sophie-protos — single source of truth for all sophie gRPC contracts'

// ── Single place to pin the proto/grpc toolchain. This is now the ONLY repo that runs protoc; every
//    service and the gateway consume the generated stubs from this artifact instead of generating
//    their own. Keep these in lockstep — bumping here bumps the wire tooling for the whole platform.
ext {
    protocVersion       = '3.25.5'
    grpcVersion         = '1.68.0'   // protoc-gen-grpc-java AND the grpc-java runtime libs
    protobufJavaVersion = '3.25.5'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${protocVersion}"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}"
        }
    }
    generateProtoTasks {
        all()*.plugins {
            grpc {}
        }
    }
}

dependencies {
    // Exported (api) so every consumer gets the proto/grpc runtime transitively and can drop its own
    // direct declarations — the generated stubs in this jar need these at compile+runtime.
    api "io.grpc:grpc-protobuf:${grpcVersion}"
    api "io.grpc:grpc-stub:${grpcVersion}"
    api "com.google.protobuf:protobuf-java:${protobufJavaVersion}"
    // grpc-java generated stubs reference javax.annotation.Generated; needed only to COMPILE the
    // generated sources here, never at runtime — so compileOnly, and not exported to consumers.
    compileOnly 'org.apache.tomcat:annotations-api:6.0.53'
}

// Ship the .proto sources inside the jar exactly ONCE, under /proto — a single namespaced tree a future
// Dart/TypeScript consumer can point protoc at (e.g. `protoc -I=<jar>/proto ...`). The protobuf plugin
// also copies them into the jar ROOT, producing a confusing doubled tree, so drop any .proto that is NOT
// under proto/ and keep the single namespaced copy this jar block adds.
jar {
    from('src/main/proto') {
        into 'proto'
    }
    eachFile { details ->
        if (details.name.endsWith('.proto') && !details.path.startsWith('proto/')) {
            details.exclude()
        }
    }
}

// Emit the DECLARED version (tag-independent) so the publish workflow can assert it matches the git tag
// (a v0.1.0 tag must publish 0.1.0) and fail loudly on a mismatch rather than shipping the wrong version.
tasks.register('printVersion') {
    doLast { println DECLARED_VERSION }
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
    repositories {
        // GitHub Packages. Owner + credentials come from gradle properties (~/.gradle/gradle.properties)
        // or env vars, so nothing secret lives in the repo. See README / the pass-1 report for setup.
        maven {
            name = 'GitHubPackages'
            url = uri("https://maven.pkg.github.com/${project.findProperty('gpr.owner') ?: 'Sophie-KC'}/sophie-protos")
            credentials {
                username = project.findProperty('gpr.user') ?: System.getenv('GITHUB_ACTOR')
                password = project.findProperty('gpr.key') ?: System.getenv('GITHUB_TOKEN')
            }
        }
    }
}
